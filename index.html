/* ================= 第四批：图片工具 ================= */

function convDraw(api, kernel, opts={}){
  const img=api.img; if(!img) return;
  const s=Math.min(1, api.max/Math.max(img.naturalWidth,img.naturalHeight));
  const w=Math.round(img.naturalWidth*s), h=Math.round(img.naturalHeight*s);
  const cv=api.cv; cv.width=w; cv.height=h;
  const ctx=cv.getContext('2d');
  ctx.clearRect(0,0,w,h);
  ctx.drawImage(img,0,0,w,h);
  const src=ctx.getImageData(0,0,w,h);
  const dst=ctx.createImageData(w,h);
  const d=src.data, o=dst.data;
  const div=kernel.div||1, bias=kernel.bias||0;
  for(let y=0;y<h;y++){
    for(let x=0;x<w;x++){
      let r=0,g=0,b=0;
      kernel.m.forEach((row,ky)=>{
        row.forEach((k,kx)=>{
          const px=Math.min(w-1,Math.max(0,x+kx-kernel.o)), py=Math.min(h-1,Math.max(0,y+ky-kernel.o));
          const i=(py*w+px)*4;
          r+=d[i]*k; g+=d[i+1]*k; b+=d[i+2]*k;
        });
      });
      const i=(y*w+x)*4;
      o[i]=Math.min(255,Math.max(0,r/div+bias));
      o[i+1]=Math.min(255,Math.max(0,g/div+bias));
      o[i+2]=Math.min(255,Math.max(0,b/div+bias));
      o[i+3]=d[i+3];
    }
  }
  if(opts.mono){
    for(let i=0;i<o.length;i+=4){ const v=(o[i]+o[i+1]+o[i+2])/3; o[i]=o[i+1]=o[i+2]=opts.invert?255-v:v; }
  }
  ctx.putImageData(dst,0,0);
}

/* ICO */
function t_ico(root){
  const api=imgTool(root,`
    <div class="lbl" style="margin-top:12px">输出尺寸</div>
    <div class="seg" id="icoSz"><button class="on" data-v="64">64</button><button data-v="128">128</button><button data-v="256">256</button></div>
    <p class="hint">生成 Windows 图标 .ico，多用于网站 favicon 和桌面快捷方式。</p>`,'图标');
  let size=64;
  segBind(root,'#icoSz',v=>{ size=+v; });
  root.querySelector('[data-iw-save]').onclick=()=>{
    if(!api.img) return toast('先选择图片');
    const img=api.img;
    const cv=document.createElement('canvas'); cv.width=cv.height=size;
    const ctx=cv.getContext('2d');
    const s=size/Math.max(img.naturalWidth,img.naturalHeight);
    const w=img.naturalWidth*s, h=img.naturalHeight*s;
    ctx.clearRect(0,0,size,size);
    ctx.drawImage(img,(size-w)/2,(size-h)/2,w,h);
    cv.toBlob(async b=>{
      const buf=new Uint8Array(await b.arrayBuffer());
      const head=new Uint8Array([0,0,1,0,1,0]);
      const entry=new Uint8Array(16);
      entry[0]=size>=256?0:size; entry[1]=size>=256?0:size; entry[2]=0; entry[3]=0;
      entry.writeUInt16LE(1,4); entry.writeUInt16LE(32,6);
      entry.writeUInt32LE(buf.length,8); entry.writeUInt32LE(22,12);
      download(new Blob([head,entry,buf],{type:'image/x-icon'}),'图标_'+size+'_'+Date.now()+'.ico');
      toast('已生成 '+size+' px 图标');
    },'image/png');
  };
  onPick(api,()=>{
    const img=api.img; if(!img) return;
    api.cv.width=img.naturalWidth; api.cv.height=img.naturalHeight;
    api.cv.getContext('2d').drawImage(img,0,0,api.cv.width,api.cv.height);
  });
}

      <button class="btn block" id="cgSave" style="margin-top:12px">保存拼图</button></div>
    <p class="hint">把多张照片按网格拼成一张图，适合发朋友圈和做九宫格。</p>`;
  let imgs=[], cols=3;
  segBind(root,'#cgCol',v=>{ cols=+v; draw(); });
  $('#cgPick',root).onclick=async ()=>{
    const fs=await pickFile('image/*', true);
    if(!fs) return;
    imgs=await Promise.all((Array.isArray(fs)?fs:[fs]).slice(0,16).map(loadImg));
    $('#cgWrap',root).style.display='';
    draw();
  };
  function draw(){
    if(!imgs.length) return;
    const gap=Math.max(0,+$('#cgGap',root).value||0);
    const cell=Math.round(Math.min(900, Math.max(...imgs.map(i=>i.naturalWidth))));
    const rows=Math.ceil(imgs.length/cols);
    const cv=$('#cgCv',root);
    cv.width=cell*cols+gap*(cols+1);
    cv.height=cell*rows+gap*(rows+1);
    const ctx=cv.getContext('2d');
    ctx.fillStyle=$('#cgBg',root).value; ctx.fillRect(0,0,cv.width,cv.height);
    imgs.forEach((im,i)=>{
      const c=i%cols, r=Math.floor(i/cols);
      const x=gap+c*(cell+gap), y=gap+r*(cell+gap);
      const s=Math.max(cell/im.naturalWidth, cell/im.naturalHeight);
      const w=im.naturalWidth*s, h=im.naturalHeight*s;
      ctx.save(); ctx.beginPath(); ctx.rect(x,y,cell,cell); ctx.clip();
      ctx.drawImage(im, x+(cell-w)/2, y+(cell-h)/2, w, h);
      ctx.restore();
    });
  }
  $('#cgSave',root).onclick=()=>{ const cv=$('#cgCv',root); cv.toBlob(b=>{download(b,'拼图_'+Date.now()+'.jpg'); toast('已保存');},'image/jpeg',0.92); };

    <input type="range" id="hd" min="3" max="14" value="6">`,'半调');
  function draw(){
    const img=api.img; if(!img) return;
    const s=Math.min(1, 900/Math.max(img.naturalWidth,img.naturalHeight));
    const w=Math.round(img.naturalWidth*s), h=Math.round(img.naturalHeight*s);
    const cv=api.cv; cv.width=w; cv.height=h;
    const ctx=cv.getContext('2d');
    const tmp=document.createElement('canvas'); tmp.width=w; tmp.height=h;
    tmp.getContext('2d').drawImage(img,0,0,w,h);
    const d=tmp.getContext('2d').getImageData(0,0,w,h).data;
    ctx.fillStyle='#fff'; ctx.fillRect(0,0,w,h);
    ctx.fillStyle='#15181D';
    const step=Math.max(2,+$('#hd',root).value||6);
    for(let y=0;y<h;y+=step){
      for(let x=0;x<w;x+=step){
        const i=(y*w+x)*4, lum=(d[i]*0.3+d[i+1]*0.59+d[i+2]*0.11)/255;
        const r=step*0.55*(1-lum);
        if(r>0.4){ ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fill(); }
      }
    }
  }
  $('#hd',root).addEventListener('input',draw);
  onPick(api,draw);
}

function t_circleavatar(root){

    const size=Math.max(64,Math.min(1600,+$('#caS',root).value||512));
    const cv=api.cv; cv.width=cv.height=size;
    const ctx=cv.getContext('2d');
    ctx.fillStyle=$('#caBg',root).value; ctx.fillRect(0,0,size,size);
    const w=$('#caW',root).value?+$('#caW',root).value:0;
    ctx.save();
    ctx.beginPath(); ctx.arc(size/2,size/2,size/2,0,Math.PI*2); ctx.clip();
    const s=Math.max(size/img.naturalWidth, size/img.naturalHeight);
    const dw=img.naturalWidth*s, dh=img.naturalHeight*s;
    ctx.drawImage(img,(size-dw)/2,(size-dh)/2,dw,dh);
    ctx.restore();
    if(w>0){
      ctx.beginPath(); ctx.arc(size/2,size/2,size/2-w/2,0,Math.PI*2);
      ctx.lineWidth=w; ctx.strokeStyle=$('#caB',root).value; ctx.stroke();
    }

function t_prepay(root){
  calcTool(root,{fields:[
    ['total','贷款总额（万元）',100,'#'],
    ['rate','年利率 %',3.6,'#'],
    ['years','贷款年限',20,1],
    ['paid','已还年限',5,0.5],
    ['extra','一次提前还款（万元）',10,0.5]
  ],note:'按等额本息估算：提前还款直接冲减本金，月供不变、期限缩短。',run:v=>{
    const P=v.total*10000, r=v.rate/100/12, n=v.years*12, ex=v.extra*10000;
    if(P<=0||n<=0) return [['请输入贷款信息','—']];
    const pay=P*r*Math.pow(1+r,n)/(Math.pow(1+r,n)-1);
    const k=Math.min(n, Math.round(v.paid*12));
    let bal=P;
    for(let i=0;i<k;i++){ const int=bal*r; bal=bal-(pay-int); }
    bal=Math.max(0,bal);
    const willPay=pay*(n-k);
    const willInt=willPay-bal;
    const bal2=Math.max(0,bal-ex);
    let m=0, int2=0, b=bal2, pay2=pay;
    if(bal2<=0){ pay2=0; }
    else{ while(b>0 && m<600){ const int=b*r; int2+=int; b=b-(pay-int); m++; } }
    return [
      ['每月还款', Math.round(pay)+' 元'],
      ['已还期数', k+' 月'],
      ['剩余本金', Math.round(bal)+' 元'],
      ['不提前还的总利息', Math.round(willInt)+' 元'],
      ['提前还后剩余期数', m+' 月'],
      ['提前还后可省利息', Math.max(0,Math.round(willInt-int2))+' 元']
    ];
  }});
}

    </div>
    <div class="box"><p class="lbl">打点记录</p><div id="ltList" style="font-size:13.5px;line-height:1.9">—</div></div>`;
  let t0=0, timer=null, laps=[];
  function fmt(ms){
    const m=Math.floor(ms/60000), s=Math.floor(ms/1000)%60, c=Math.floor(ms/10)%100;
    return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0')+'.'+String(c).padStart(2,'0');
  }
  function tick(){ $('#ltT',root).textContent=fmt(t0?Date.now()-t0:0); }
  function start(){ if(timer) return; t0=Date.now(); timer=setInterval(tick,50); $('#ltGo',root).textContent='暂停'; }
  function pause(){ clearInterval(timer); timer=null; $('#ltGo',root).textContent='继续'; }
  $('#ltGo',root).onclick=()=>timer?pause():start();
  $('#ltLap',root).onclick=()=>{
    if(!t0) return toast('先开始计时');
    const now=Date.now()-t0;
    laps.unshift(fmt(now)+'  ·  间隔 '+fmt(now-(laps.length?parseMs(laps[0]):0)));
    $('#ltList',root).innerHTML=laps.map((l,i)=>`<div>${laps.length-i}. ${l}</div>`).join('');
  };
  function parseMs(s){ const p=s.split('  ')[0].split(':'), q=p[1].split('.'); return (+p[0])*60000+(+q[0])*1000+(+q[1])*10; }
  $('#ltRst',root).onclick=()=>{ clearInterval(timer); timer=null; t0=0; laps=[]; $('#ltT',root).textContent='00:00.00'; $('#ltList',root).textContent='—'; $('#ltGo',root).textContent='开始'; };

}

  let list=[];

  function save(){ try{ localStorage.setItem('xy_anniv', JSON.stringify(list)); }catch(e){} }

    $('#anList',root).innerHTML=list.length?list.map((it,i)=>{

      if(next<today) next.setFullYear(next.getFullYear()+1);
      const left=Math.round((next-today)/86400000);
      return `<div style="padding:10px 0;border-bottom:1px solid #F1F3F7">
        <div style="display:flex;justify-content:space-between"><b>${it.n}</b><span style="color:var(--sub);font-size:13px">${it.d}</span></div>

function t_json2ts(root){
  root.innerHTML=`
    <div class="box">
      <textarea id="jtIn" style="min-height:130px">{"id":1,"name":"张三","tags":["a","b"],"ok":true}</textarea>
      <div class="lbl" style="margin-top:10px">接口名</div><input id="jtName" value="User">
      <button class="btn block" id="jtGo" style="margin-top:10px">生成 TypeScript</button>
    </div>
    ${txtOut('接口定义','jtOut')}`;
  function typeOf(v){
    if(v===null) return 'null';
    if(Array.isArray(v)) return v.length?typeOf(v[0])+'[]':'any[]';
    if(typeof v==='object') return '{'+Object.entries(v).map(([k,x])=>k+': '+typeOf(x)).join('; ')+'}';
    return typeof v;
  }
  function iface(obj,name){
    const lines=['export interface '+name+' {'];
    Object.entries(obj).forEach(([k,v])=>{
      const t=Array.isArray(v)&&v.length&&typeof v[0]==='object'?name.replace(/^./,c=>c.toUpperCase())+'Item[]':typeOf(v);
      lines.push('  '+k+': '+t+';');
    });
    lines.push('}');
    return lines.join('\n');
  }
  $('#jtGo',root).onclick=()=>{
    let d; try{ d=JSON.parse($('#jtIn',root).value); }catch(e){ return toast('JSON 格式有误'); }
    const name=$('#jtName',root).value.trim()||'Root';
    if(Array.isArray(d)) d=d[0]||{};
    $('#jtOut',root).textContent=iface(d,name);
  };
}

function t_htmlfmt(root){
  convTool(root,{def:'<div><p>hello</p><span>x</span></div>',outLabel:'结果',modes:[
    {label:'缩进格式化',fn:s=>{
      const doc=new DOMParser().parseFromString(s,'text/html');
      let out='';
      const ind=n=>'  '.repeat(n);
      const walk=(node,d)=>{
        if(node.nodeType===3){ const t=node.nodeValue.trim(); if(t) out+=ind(d)+t+'\n'; return; }
        if(node.nodeType!==1) return;
        const name=node.nodeName.toLowerCase();
        if(['br','img','hr','input','meta','link'].includes(name)){ out+=ind(d)+'<'+name+'>\n'; return; }
        out+=ind(d)+'<'+name+(node.getAttributeNames&&node.attributes.length?' '+Array.from(node.attributes).map(a=>a.name+'="'+a.value+'"').join(' '):'')+'>\n';
        Array.from(node.childNodes).forEach(k=>walk(k,d+1));
        out+=ind(d)+'</'+name+'>\n';
      };
      Array.from(doc.body.childNodes).forEach(k=>walk(k,0));
      return out.trim();
    }},
    {label:'压缩',fn:s=>s.replace(/\n+/g,' ').replace(/>\s+</g,'><').replace(/\s{2,}/g,' ').trim()}
  ]});
}

function t_palette(root){
  root.innerHTML=`
    <div class="box">
      <div class="lbl">主色</div><input type="color" id="paC" value="#2C63F0">
      <div id="paOut" style="margin-top:14px;display:grid;grid-template-columns:repeat(4,1fr);gap:8px"></div>
      <p class="hint" id="paHint">点击色块可复制色值。</p>
    </div>`;
  function hexToHsl(h){
    let r=parseInt(h.substr(1,2),16)/255,g=parseInt(h.substr(3,2),16)/255,b=parseInt(h.substr(5,2),16)/255;
    const max=Math.max(r,g,b), min=Math.min(r,g,b); let hh=0,s=0,l=(max+min)/2;
    if(max!==min){ const d=max-min; s=l>0.5?d/(2-max-min):d/(max+min);
      hh = max===r?((g-b)/d+(g<b?6:0)) : max===g?((b-r)/d+2) : ((r-g)/d+4); hh/=6; }
    return [hh*360, s*100, l*100];
  }
  function hslToHex(h,s,l){
    s/=100; l/=100;
    const k=n=>(n+h/30)%12, a=s*Math.min(l,1-l);
    const f=n=>l-a*Math.max(-1,Math.min(k(n)-3,Math.min(9-k(n),1)));
    const to=v=>Math.round(v*255).toString(16).padStart(2,'0');
    return '#'+to(f(0))+to(f(8))+to(f(4));
  }
  function run(){
    const base=$('#paC',root).value;
    const [h,s,l]=hexToHsl(base);
    const set=[
      ['主色',base],
      ['浅调',hslToHex(h,Math.min(100,s),Math.min(96,l+28))],
      ['深调',hslToHex(h,Math.min(100,s),Math.max(8,l-26))],
      ['互补',hslToHex((h+180)%360,s,l)],
      ['邻近',hslToHex((h+30)%360,s,l)],
      ['三角',hslToHex((h+120)%360,s,l)],
      ['灰阶',hslToHex(h,8,l)],
      ['强调',hslToHex((h+180)%360,Math.max(40,s),Math.max(30,l-10))]
    ];
    $('#paOut',root).innerHTML=set.map(([n,c])=>`<div data-hex="${c}" style="cursor:pointer;text-align:center">
      <div style="height:54px;border-radius:10px;background:${c};border:1px solid var(--line)"></div>
      <div style="font-size:11.5px;color:var(--sub);margin-top:4px">${n}</div>
      <div style="font-size:11px;font-family:ui-monospace,monospace">${c}</div></div>`).join('');
  }
  root.addEventListener('input',run);
  root.addEventListener('click',e=>{ const d=e.target.closest('[data-hex]'); if(d) copyText(d.dataset.hex); });
  run();
}

  function save(){ try{ localStorage.setItem(key, JSON.stringify(items)); }catch(e){} }

  $('#ckClr',root).onclick=()=>{ items=items.filter(i=>!i.done); save(); render(); };

function t_spectrum(root){
  root.innerHTML=`
    <div class="box">
      <canvas id="spCv" style="width:100%;height:140px;border-radius:10px;background:#0E1116"></canvas>
      <div class="row" style="margin-top:10px">
        <button class="btn" id="spGo">开始</button><button class="btn ghost" id="spStop">停止</button>
      </div>
    </div>
    <p class="hint">对着手机说话或放音乐，看频谱跳动，用来判断麦克风是否正常。</p>`;
  let stream=null, ac=null, raf=null;
  function stop(){
    cancelAnimationFrame(raf); raf=null;
    if(stream){ stream.getTracks().forEach(t=>t.stop()); stream=null; }
    if(ac){ try{ac.close();}catch(e){} ac=null; }
  }
  $('#spGo',root).onclick=async ()=>{
    stop();
    try{
      stream=await navigator.mediaDevices.getUserMedia({audio:true});
      ac=new (window.AudioContext||window.webkitAudioContext)();
      const an=ac.createAnalyser(); an.fftSize=256;
      ac.createMediaStreamSource(stream).connect(an);
      const buf=new Uint8Array(an.frequencyBinCount);
      const cv=$('#spCv',root), ctx=cv.getContext('2d');
      const loop=()=>{
        if(!cv.isConnected){ stop(); return; }
        an.getByteFrequencyData(buf);
        const w=cv.clientWidth, h=cv.clientHeight;
        if(cv.width!==w*2){ cv.width=w*2; cv.height=h*2; }
        ctx.setTransform(2,0,0,2,0,0);
        ctx.fillStyle='#0E1116'; ctx.fillRect(0,0,w,h);
        const bars=48, bw=w/bars;
        for(let i=0;i<bars;i++){
          const v=buf[Math.floor(i/bars*buf.length)]/255;
          const bh=v*h*0.9;
          ctx.fillStyle='hsl('+(190-v*120)+',80%,55%)';
          ctx.fillRect(i*bw+1, h-bh, bw-2, bh);
        }
        raf=requestAnimationFrame(loop);
      };
      loop();
    }catch(e){ toast('无法访问麦克风'); }
  };
  $('#spStop',root).onclick=stop;
  return stop;
}

      <div class="kv" style="margin-top:12px"><span>录音时长</span><b id="mpLen">—</b></div>

    }catch(e){ toast('无法访问麦克风'); }
  };
  $('#mpStop',root).onclick=()=>{ if(rec&&rec.state!=='inactive') rec.stop(); if(stream){stream.getTracks().forEach(t=>t.stop()); stream=null;} };
  $('#mpPlay',root).onclick=()=>{ if(!url) return toast('先录一段'); new Audio(url).play().catch(()=>toast('播放失败')); };

function t_orient(root){
  root.innerHTML=`
    <div class="box" style="text-align:center;padding:18px">
      <canvas id="orCv" style="width:100%;height:220px;border-radius:10px;background:#FAFBFD;border:1px solid var(--line)"></canvas>
      <button class="btn block" id="orGo" style="margin-top:12px">开始</button>
    </div>
    <p class="hint">移动手机，看指示点随之移动，用来验证方向传感器是否正常。</p>`;
  let stop=null, raf=null;
  const cv=$('#orCv',root), ctx=cv.getContext('2d');
  let beta=0, gamma=0;
  function draw(){
    const w=cv.clientWidth, h=cv.clientHeight;
    if(cv.width!==w*2 || cv.height!==h*2){ cv.width=w*2; cv.height=h*2; }
    ctx.setTransform(2,0,0,2,0,0);
    ctx.clearRect(0,0,w,h);
    ctx.strokeStyle='#E5E8EC';
    ctx.beginPath(); ctx.arc(w/2,h/2,Math.min(w,h)/2-10,0,Math.PI*2); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(w/2,10); ctx.lineTo(w/2,h-10); ctx.moveTo(10,h/2); ctx.lineTo(w-10,h/2); ctx.stroke();
    const r=Math.min(w,h)/2-10;
    const x=w/2+Math.max(-1,Math.min(1,gamma/90))*r;
    const y=h/2+Math.max(-1,Math.min(1,beta/90))*r;
    ctx.fillStyle='#2C63F0'; ctx.beginPath(); ctx.arc(x,y,12,0,Math.PI*2); ctx.fill();
    raf=requestAnimationFrame(draw);
  }
  $('#orGo',root).onclick=()=>{
    if(stop){ stop(); stop=null; cancelAnimationFrame(raf); return; }
    stop=readOrientation(e=>{ beta=e.beta||0; gamma=e.gamma||0; },()=>toast('当前环境没有方向传感器'));
    draw();
  };
  return ()=>{ if(stop) stop(); cancelAnimationFrame(raf); };
}

  root.addEventListener('input',draw);
  function draw(){
    if(!imgs.length) return;
    const gap=Math.max(0,+$('#glGap',root).value||0);
    const w=Math.min(1000, Math.max(...imgs.map(i=>i.naturalWidth)));
    const scaled=imgs.map(i=>{ const s=w/i.naturalWidth; return {img:i, w, h:Math.round(i.naturalHeight*s)}; });
    const totalH=scaled.reduce((a,b)=>a+b.h,0)+gap*(scaled.length+1);
    const cv=$('#glCv',root); cv.width=w+gap*2; cv.height=totalH;
    const ctx=cv.getContext('2d');
    ctx.fillStyle=$('#glBg',root).value; ctx.fillRect(0,0,cv.width,cv.height);
    let y=gap;
    scaled.forEach(s=>{ ctx.drawImage(s.img, gap, y, s.w, s.h); y+=s.h+gap; });
  }
  $('#glSave',root).onclick=()=>{ if(!imgs.length) return toast('先选图片'); $('#glCv',root).toBlob(b=>{download(b,'拼接长图_'+Date.now()+'.jpg'); toast('已保存');},'image/jpeg',0.92); };
}

function t_creditinstallment(root){

    return [['每月还款',m.toFixed(2)+' 元'],['总还款',(m*n).toFixed(2)+' 元'],['总手续费/利息',(m*n-p).toFixed(2)+' 元']];

function t_wiregauge(root){

function t_brakepath(root){

function t_sipreturn(root){

  },note:'按月定投、按月复利估算，不含税费。'});
}

function t_minpayment(root){

function t_breakeven(root){

function t_rpm(root){

function t_annualreturn(root){

function t_ceilingframe(root){

}

      <div class="hint" id="ctSub">设置后开始倒数</div>
    </div>
    <p class="hint">倒数到考试、纪念日、假期，刷新页面后重新设置即可。</p>`;
  let timer=null;
  function tick(){
    const v=$('#ctIn',root).value;
    if(!v){ $('#ctBig',root).textContent='--'; return; }
    const d=new Date(v)-new Date();
    if(d<=0){ $('#ctBig',root).textContent='已到时间'; $('#ctSub',root).textContent=$('#ctName',root).value; return; }
    const day=Math.floor(d/86400000), hr=Math.floor(d%86400000/3600000), mi=Math.floor(d%3600000/60000), se=Math.floor(d%60000/1000);
    $('#ctBig',root).textContent=`${day} 天 ${String(hr).padStart(2,'0')}:${String(mi).padStart(2,'0')}:${String(se).padStart(2,'0')}`;
    $('#ctSub',root).textContent=$('#ctName',root).value;
  }
  $('#ctIn',root).onchange=()=>{ clearInterval(timer); timer=setInterval(tick,1000); tick(); };
  tick();
  return ()=>clearInterval(timer);
}

      left=Math.max(1,+$('#rlMin',root).value||30)*60;

    $('#rlNext',root).textContent=Math.floor(left/60)+':'+String(left%60).padStart(2,'0');

function t_mathquiz(root){
  root.innerHTML=`
    <div class="box" style="text-align:center">
      <div class="kv"><span>得分</span><b id="mqScore">0 / 0</b></div>
      <div id="mqQ" style="font-size:32px;font-weight:700;margin:18px 0">准备开始</div>
      <input id="mqA" inputmode="numeric" placeholder="答案" style="text-align:center;font-size:20px">

    </div>
    <p class="hint">口算练习，适合给孩子或自己练手速。</p>`;
  let a=0,b=0,op='+',ans=0,right=0,total=0,on=false;
  function next(){
    a=Math.floor(Math.random()*20)+1; b=Math.floor(Math.random()*20)+1;
    const ops=['+','-','×']; op=ops[Math.floor(Math.random()*3)];
    ans=op==='+'?a+b:op==='-'?Math.max(a,b)-Math.min(a,b):a*b;
    if(op==='-'&&a<b){ [a,b]=[b,a]; ans=a-b; }
    $('#mqQ',root).textContent=`${a} ${op} ${b} = ?`;
    $('#mqA',root).value=''; $('#mqA',root).focus();
  }
  $('#mqGo',root).onclick=()=>{
    if(!on){ on=true; next(); return; }
    const v=+$('#mqA',root).value;
    total++;
    if(v===ans){ right++; toast('答对了'); } else { toast('答案是 '+ans); }
    $('#mqScore',root).textContent=right+' / '+total;
    next();
  };
}

function t_json2yaml(root){
  convTool(root,{def:'{"name":"小羽工具箱","version":"1.7","tags":["本地","离线"],"author":{"name":"fornow","group":728403008}}',outLabel:'YAML',modes:[{label:'JSON → YAML',
    fn:s=>{const o=JSON.parse(s);
      function emit(v,ind){
        const pad='  '.repeat(ind);
        if(Array.isArray(v)) return v.map(x=>typeof x==='object'&&x!==null?pad+'- '+emit(x,ind+1).trimStart():pad+'- '+fmt(x)).join('\n');
        if(v&&typeof v==='object') return Object.entries(v).map(([k,x])=>typeof x==='object'&&x!==null?pad+k+':\n'+emit(x,ind+1):pad+k+': '+fmt(x)).join('\n');
        return pad+fmt(v);
      }
      function fmt(v){ return typeof v==='string'?v:String(v); }
      return emit(o,0);}}],note:'把接口返回的 JSON 转成配置文件写法。'});
}

function t_yaml2json(root){
  convTool(root,{def:'name: 小羽工具箱\nversion: 1.7\ntags:\n  - 本地\n  - 离线',outLabel:'JSON',modes:[{label:'YAML → JSON',
    fn:s=>{
      const lines=s.split('\n').filter(l=>l.trim()&&!l.trim().startsWith('#'));
      const root={}; const stack=[{obj:root,ind:-1}];
      lines.forEach(raw=>{
        const ind=raw.match(/^\s*/)[0].length;
        const line=raw.trim();
        while(stack.length>1 && ind<=stack[stack.length-1].ind) stack.pop();
        const cur=stack[stack.length-1].obj;
        if(line.startsWith('- ')){
          const val=line.slice(2).trim();
          if(Array.isArray(cur)) cur.push(val);
          return;
        }
        const m=line.match(/^([^:]+):\s*(.*)$/); if(!m) return;
        const k=m[1].trim(), v=m[2].trim();
        if(!v){ const child={}; cur[k]=child; stack.push({obj:child,ind}); }
        else cur[k]=v;
      });
      return JSON.stringify(root,null,2);}}],note:'支持简单的键值、缩进与列表，复杂 YAML 建议用专业工具。'});
}

function t_xml2json(root){
  convTool(root,{def:'<user><name>fornow</name><group>728403008</group><tools>255</tools></user>',outLabel:'JSON',modes:[{label:'XML → JSON',
    fn:s=>{
      const doc=new DOMParser().parseFromString(s,'application/xml');
      const err=doc.querySelector('parsererror'); if(err) throw new Error('XML 格式有误');
      function walk(n){
        const kids=[...n.children];
        if(!kids.length) return n.textContent.trim();
        const o={};
        kids.forEach(c=>{ const k=c.tagName; if(o[k]){ if(!Array.isArray(o[k])) o[k]=[o[k]]; o[k].push(walk(c)); } else o[k]=walk(c); });
        return o;
      }
      return JSON.stringify(walk(doc.documentElement),null,2);}}]});
}

        const pad='  '.repeat(ind);
        if(Array.isArray(v)) return v.map(x=>build(x,k,ind)).join('\n');
        if(v&&typeof v==='object') return pad+'<'+k+'>\n'+Object.entries(v).map(([kk,vv])=>build(vv,kk,ind+1)).join('\n')+'\n'+pad+'</'+k+'>';

}

function t_jsonflat(root){

    fn:s=>{

function t_jsondiff(root){
  convTool(root,{def:'{"a":1,"b":2,"c":3}\n----\n{"a":1,"b":9,"d":4}',outLabel:'差异',modes:[{label:'比较两段 JSON',
    fn:s=>{
      const [x,y]=s.split('----');
      if(!y) throw new Error('用 ---- 分隔两段 JSON');
      const A=JSON.parse(x), B=JSON.parse(y); const out=[];
      const keys=new Set([...Object.keys(A),...Object.keys(B)]);
      keys.forEach(k=>{
        const av=JSON.stringify(A[k]), bv=JSON.stringify(B[k]);
        if(!(k in A)) out.push('+ '+k+' = '+bv);
        else if(!(k in B)) out.push('- '+k+' = '+av);
        else if(av!==bv) out.push('~ '+k+' : '+av+' → '+bv);
      });
      return out.join('\n')||'没有差异';}}],note:'只比较顶层字段，适合核对接口返回。'});
}

function t_subnet(root){
  convTool(root,{def:'192.168.1.10/24',outLabel:'结果',modes:[{label:'计算网段',
    fn:s=>{
      const [ip,cidr]=s.trim().split('/'); const bits=+cidr;
      if(!ip||isNaN(bits)) throw new Error('格式如 192.168.1.10/24');
      const p=ip.split('.').map(Number); if(p.length!==4) throw new Error('IP 格式有误');
      const mask=bits===0?0:(0xFFFFFFFF<<(32-bits))>>>0;
      const ipInt=((p[0]<<24)>>>0)+(p[1]<<16)+(p[2]<<8)+p[3];
      const net=(ipInt&mask)>>>0, bcast=(net|(~mask>>>0))>>>0;
      const toIp=n=>[n>>>24,(n>>16)&255,(n>>8)&255,n&255].join('.');
      const hosts=Math.max(0,Math.pow(2,32-bits)-2);
      return `网段 ${toIp(net)}/${bits}\n掩码 ${toIp(mask)}\n可用范围 ${toIp(net+1)} – ${toIp(bcast-1)}\n广播 ${toIp(bcast)}\n主机数 ${hosts}`;
    }}]});
}

      return `${l}  →  ${total} 个地址（${kind}）`;
    }).join('\n')}]});
}

  convTool(root,{def:'Content-Type: application/json\nCache-Control: no-cache\nSet-Cookie: uid=abc; Path=/\nAuthorization: Bearer xxx',outLabel:'解析',modes:[{label:'解析请求头',
    fn:s=>s.split('\n').filter(l=>l.includes(':')).map(l=>{const i=l.indexOf(':');const k=l.slice(0,i).trim(),v=l.slice(i+1).trim();return `${k}\n  ${v}`;}).join('\n')},
    {label:'生成对象',fn:s=>{const o={};s.split('\n').filter(l=>l.includes(':')).forEach(l=>{const i=l.indexOf(':');o[l.slice(0,i).trim()]=l.slice(i+1).trim();});return JSON.stringify(o,null,2);}},
    {label:'转小写名',fn:s=>s.split('\n').filter(l=>l.includes(':')).map(l=>l.toLowerCase()).join('\n')}
  ]});
}

function t_cookie(root){
  convTool(root,{def:'uid=abc123; Path=/; Domain=.example.com; Max-Age=86400; HttpOnly; Secure',outLabel:'解析',modes:[{label:'拆分属性',
    fn:s=>s.split(';').map(x=>x.trim()).filter(Boolean).map(x=>{const i=x.indexOf('=');return i<0?x+'（标记）':x.slice(0,i)+' = '+x.slice(i+1);}).join('\n')},
    {label:'只看键值',fn:s=>s.split(';').filter(x=>x.includes('=')).map(x=>x.trim()).join('\n')},
    {label:'检查安全项',fn:s=>{const low=s.toLowerCase();return ['Secure '+(low.includes('secure')?'已设置':'缺失'),'HttpOnly '+(low.includes('httponly')?'已设置':'缺失'),'SameSite '+(low.includes('samesite')?'已设置':'缺失')].join('\n');}}
  ],note:'用于检查登录 Cookie 的安全属性，不涉及任何账号操作。'});
}

function t_envparse(root){
  convTool(root,{def:'APP_NAME=小羽工具箱\nVERSION=1.7\nDEBUG=false\n# 注释行\nGREETING="hello world"',outLabel:'结果',modes:[
    {label:'转 JSON',fn:s=>{const o={};s.split('\n').forEach(l=>{const t=l.trim();if(!t||t.startsWith('#'))return;const i=t.indexOf('=');if(i<0)return;o[t.slice(0,i).trim()]=t.slice(i+1).trim().replace(/^[""]|[""]$/g,'');});return JSON.stringify(o,null,2);}},
    {label:'转 export 语句',fn:s=>s.split('\n').filter(l=>l.trim()&&!l.trim().startsWith('#')).map(l=>'export '+l.trim()).join('\n')},
    {label:'提取变量名',fn:s=>s.split('\n').filter(l=>l.includes('=')&&!l.trim().startsWith('#')).map(l=>l.split('=')[0].trim()).join('\n')}
  ]});
}

function t_cssvar(root){
  convTool(root,{def:':root{--ink:#15181D;--sub:#6E7580;--line:#E5E8EC;--brand:#2C63F0}',outLabel:'变量',modes:[{label:'提取变量表',
    fn:s=>[...s.matchAll(/--([\w-]+)\s*:\s*([^;]+);/g)].map(m=>m[1]+' = '+m[2].trim()).join('\n')||'没有找到变量'},
    {label:'转 JS 对象',fn:s=>{const o={};[...s.matchAll(/--([\w-]+)\s*:\s*([^;]+);/g)].forEach(m=>o[m[1]]=m[2].trim());return JSON.stringify(o,null,2);}},
    {label:'复制变量声明',fn:s=>[...s.matchAll(/--([\w-]+)\s*:\s*([^;]+);/g)].map(m=>`  --${m[1]}: ${m[2].trim()};`).join('\n')}
  ]});
}

function t_mdtable(root){
  convTool(root,{def:'| 名称 | 数量 |\n| --- | --- |\n| 工具 | 255 |\n| 分类 | 7 |',outLabel:'结果',modes:[
    {label:'表格转文本',fn:s=>s.split('\n').filter(l=>l.includes('|')&&!/^\|[\s:|-]+\|$/.test(l.trim())).map(l=>l.split('|').slice(1,-1).map(x=>x.trim()).join('  |  ')).join('\n')},
    {label:'表格转 CSV',fn:s=>s.split('\n').filter(l=>l.includes('|')&&!/^\|[\s:|-]+\|$/.test(l.trim())).map(l=>l.split('|').slice(1,-1).map(x=>x.trim()).join(',')).join('\n')},
    {label:'压缩列宽',fn:s=>s.split('\n').filter(l=>l.includes('|')).map(l=>'|'+l.split('|').slice(1,-1).map(x=>x.trim()).join('|')+'|').join('\n')}
  ]});
}

function t_json2env(root){
  convTool(root,{def:'{"APP_NAME":"小羽工具箱","VERSION":"1.7","DEBUG":false}',outLabel:'ENV',modes:[{label:'JSON → .env',
    fn:s=>Object.entries(JSON.parse(s)).map(([k,v])=>k.toUpperCase()+'='+(typeof v==='string'?v:String(v))).join('\n')}]});
}

function t_codecount(root){
  convTool(root,{def:'function a(){\n  // 注释\n  return 1;\n}\n\n\nfunction b(){}',outLabel:'统计',modes:[{label:'统计行数',fn:s=>{const total=s.split('\n').length;const code=s.split('\n').filter(l=>l.trim()&&!l.trim().startsWith('//')).length;const blank=s.split('\n').filter(l=>!l.trim()).length;return `总行 ${total}\n有效代码 ${code}\n空行 ${blank}`;}},
    {label:'估算字符',fn:s=>`${s.length} 个字符（含空白）`},
    {label:'查看最长行',fn:s=>{const a=s.split('\n');const m=Math.max(...a.map(l=>l.length));return '最长 '+m+' 字符：'+(a.find(l=>l.length===m)||'').slice(0,80);}}
  ],note:'快速看代码规模，不含注释统计精度。'});
}

function t_filesize(root){
  convTool(root,{def:'1048576',outLabel:'换算',modes:[{label:'字节换算',fn:s=>{const n=+s;if(!n||isNaN(n))throw new Error('输入数字');return `${n} B\n${(n/1024).toFixed(2)} KB\n${(n/1048576).toFixed(3)} MB\n${(n/1073741824).toFixed(4)} GB`;}},
    {label:'MB 转字节',fn:s=>String(Math.round((+s)*1048576))},
    {label:'换算网速时间',fn:s=>{const mb=+s;if(!mb)throw new Error('输入 MB 大小');return ['10 Mbps 约需 '+(mb*8/10).toFixed(0)+' 秒','50 Mbps 约需 '+(mb*8/50).toFixed(0)+' 秒','100 Mbps 约需 '+(mb*8/100).toFixed(0)+' 秒','500 Mbps 约需 '+(mb*8/500).toFixed(0)+' 秒'].join('\n');}}
  ]});
}

function t_rgb2cmyk(root){
  convTool(root,{def:'44, 99, 240',outLabel:'结果',modes:[{label:'RGB → CMYK',fn:s=>{const [r,g,b]=s.split(/[,\s]+/).map(Number);if([r,g,b].some(x=>isNaN(x)))throw new Error('格式如 44,99,240');const rr=r/255,gg=g/255,bb=b/255;const k=1-Math.max(rr,gg,bb);const c=(1-rr-k)/(1-k||1),m=(1-gg-k)/(1-k||1),y=(1-bb-k)/(1-k||1);return `CMYK ${Math.round(c*100)}, ${Math.round(m*100)}, ${Math.round(y*100)}, ${Math.round(k*100)}`;}},
    {label:'RGB → 百分比',fn:s=>{const [r,g,b]=s.split(/[,\s]+/).map(Number);return `${(r/255*100).toFixed(1)}% ${(g/255*100).toFixed(1)}% ${(b/255*100).toFixed(1)}%`;}},
    {label:'RGB → 十六进制',fn:s=>{const [r,g,b]=s.split(/[,\s]+/).map(Number);return '#'+[r,g,b].map(x=>Math.max(0,Math.min(255,x)).toString(16).padStart(2,'0')).join('').toUpperCase();}}
  ],note:'印刷用 CMYK 是近似换算，实际以打样为准。'});
}

function t_strftime(root){
  root.innerHTML=`
    <div class="box">
      <div class="lbl">日期时间</div><input type="datetime-local" id="stIn">
      <div class="lbl" style="margin-top:10px">格式</div><input id="stFmt" value="YYYY-MM-DD HH:MM:SS">
      <button class="btn block" id="stGo" style="margin-top:12px">格式化</button>
    </div>
    ${txtOut('结果','stOut')}
    <p class="hint">支持 YYYY MM DD HH MM SS，常用于写日志和文件命名。</p>`;
  const now=new Date(); const local=new Date(now.getTime()-now.getTimezoneOffset()*60000).toISOString().slice(0,16);
  $('#stIn',root).value=local;
  $('#stGo',root).onclick=()=>{
    const d=new Date($('#stIn',root).value||Date.now());
    const p=n=>String(n).padStart(2,'0');
    const out=$('#stFmt',root).value
      .replace(/YYYY/g,d.getFullYear()).replace(/MM/g,p(d.getMonth()+1)).replace(/DD/g,p(d.getDate()))
      .replace(/HH/g,p(d.getHours())).replace(/MM(?=[^M]*$)/g,p(d.getMinutes())).replace(/SS/g,p(d.getSeconds()));
    $('#stOut',root).textContent=out;
  };
}
