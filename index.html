/* ---------- 录音机 ---------- */
function t_recorder(root){
  root.innerHTML=`
    <div class="box" style="text-align:center;padding:20px 14px">
      <div id="rcv" style="font-size:34px;font-weight:700;letter-spacing:-1px;font-variant-numeric:tabular-nums">00:00</div>
      <div style="font-size:12.5px;color:var(--sub);margin-top:4px" id="rcst">点录音开始</div>
    </div>
    <div class="row">
      <button class="btn" id="rcgo">开始录音</button>
      <button class="btn ghost" id="rcstop">停止</button>
    </div>
    <div class="box" id="rcbox" style="display:none">
      <p class="lbl">最近一条</p>
      <audio id="rca" controls style="width:100%"></audio>
      <div class="row" style="margin-top:10px">
        <button class="btn ghost" id="rcdl">下载录音</button>
        <button class="btn ghost" id="rcdel">删除</button>
      </div>
      <p class="hint" id="rcinfo"></p>
    </div>
    <p class="hint">录音只存在本机内存里，关掉页面就没了，需要留存请点下载。用来录备忘、录一段灵感、试麦克风。</p>`;
  let rec=null, chunks=[], stream=null, t0=0, tick=null, blob=null, url=null;
  function fmt(ms){ const s=Math.floor(ms/1000); return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0'); }
  $('#rcgo',root).onclick=async()=>{
    if(rec) return;
    try{ stream=await navigator.mediaDevices.getUserMedia({audio:true}); }
    catch(e){ $('#rcst',root).textContent='无法访问麦克风（需 https 且允许权限）'; return; }
    chunks=[]; rec=new MediaRecorder(stream);
    rec.ondataavailable=e=>{ if(e.data.size) chunks.push(e.data); };
    rec.onstop=()=>{
      blob=new Blob(chunks,{type:rec.mimeType||'audio/webm'});
      if(url) URL.revokeObjectURL(url); url=URL.createObjectURL(blob);
      $('#rca',root).src=url; $('#rcbox',root).style.display='';
      $('#rcinfo',root).textContent='时长 '+fmt(Date.now()-t0)+' · 大小 '+bytes(blob.size);
    };
    rec.start(); t0=Date.now(); $('#rcst',root).textContent='录音中';
    $('#rcgo',root).textContent='录音中…';
    tick=setInterval(()=>{ $('#rcv',root).textContent=fmt(Date.now()-t0); },200);
  };
  $('#rcstop',root).onclick=()=>{
    if(!rec) return;
    rec.stop(); clearInterval(tick);
    if(stream) stream.getTracks().forEach(t=>t.stop());
    rec=null; stream=null; $('#rcgo',root).textContent='开始录音'; $('#rcst',root).textContent='已停止';
  };
  $('#rcdl',root).onclick=()=>{ if(!blob) return toast('先录一段'); download(blob,'录音_'+Date.now()+'.webm'); toast('已保存'); };
  $('#rcdel',root).onclick=()=>{ blob=null; $('#rcbox',root).style.display='none'; if(url){ URL.revokeObjectURL(url); url=null; } };
  return ()=>{ clearInterval(tick); if(rec){ try{rec.stop();}catch(e){} } if(stream) stream.getTracks().forEach(t=>t.stop()); rec=null; stream=null; };
}


/* 图片工具通用工作台 */
function imgTool(root, ctlHTML, saveName='图片'){
  root.innerHTML=`
    <div class="box"><button class="btn block" data-iw-pick>选择图片</button>${ctlHTML}</div>
    <div class="box" style="display:none" data-iw-wrap>
      <canvas data-iw-cv style="width:100%;border-radius:10px"></canvas>
      <button class="btn block" data-iw-save style="margin-top:12px">保存图片</button>
      <p class="hint" data-iw-meta></p>
    </div>`;
  const api={
    img:null, cv:root.querySelector('[data-iw-cv]'), wrap:root.querySelector('[data-iw-wrap]'), max:1600,
    async pick(){
      const f=await pickFile('image/*'); if(!f) return null;
      api.img=await loadImg(f); api.wrap.style.display='';
      const m=root.querySelector('[data-iw-meta]');
      if(m) m.textContent='原图 '+api.img.naturalWidth+' × '+api.img.naturalHeight+' px · '+bytes(f.size);
      return api.img;
    },
    box(w,h){
      const s=Math.min(1, api.max/Math.max(w,h));
      api.cv.width=Math.max(1,Math.round(w*s)); api.cv.height=Math.max(1,Math.round(h*s));
      return {w:api.cv.width, h:api.cv.height};
    },
    save(type='image/jpeg', q=.94){
      if(!api.cv.width) return toast('先选择图片');
      api.cv.toBlob(b=>{ download(b, saveName+'_'+Date.now()+(type==='image/png'?'.png':'.jpg')); toast('已保存'); }, type, q);
    }
  };
  root.querySelector('[data-iw-pick]').onclick=()=>api.pick();
  root.querySelector('[data-iw-save]').onclick=()=>api.save();
  return api;
}
function onPick(api, render){
  const btn=api.wrap.parentElement.querySelector('[data-iw-pick]');
  const orig=btn.onclick;
  btn.onclick=async()=>{ const img=await api.pick(); if(img) render(); };
}
function segBind(root, sel, cb){
  const el=root.querySelector(sel); if(!el) return;
  el.addEventListener('click',e=>{
    const b=e.target.closest('button'); if(!b) return;
    Array.from(el.children).forEach(x=>x.classList.toggle('on',x===b));
    cb(b.dataset.v, b);
  });
}

/* ---------- 圆角图片 ---------- */
function t_imground(root){
  const api=imgTool(root,`
    <div class="lbl" style="display:flex;justify-content:space-between;margin-top:12px"><span>圆角半径</span><b id="rrdv" style="color:var(--ink)">24 px</b></div>
    <input type="range" id="rrd" min="0" max="300" value="24">
    <div class="seg" id="rshape"><button class="on" data-v="rect">圆角矩形</button><button data-v="circle">圆形</button></div>`,'圆角');
  let r=24, shape='rect';
  function draw(){
    const img=api.img; if(!img) return;
    const s=Math.min(1, api.max/Math.max(img.naturalWidth, img.naturalHeight));
    const w=Math.round(img.naturalWidth*s), h=Math.round(img.naturalHeight*s);
    const cv=api.cv; cv.width=w; cv.height=h;
    const ctx=cv.getContext('2d'); ctx.clearRect(0,0,w,h);
    if(shape==='circle'){
      const d=Math.min(w,h);
      ctx.save(); ctx.beginPath(); ctx.arc(w/2,h/2,d/2,0,7); ctx.clip();
      ctx.drawImage(img,(w-d)/2,(h-d)/2,d,d); ctx.restore();
    }else{
      const rr=Math.min(r*s, Math.min(w,h)/2);
      ctx.save(); ctx.beginPath();
      if(ctx.roundRect) ctx.roundRect(0,0,w,h,rr);
      else { ctx.moveTo(rr,0); ctx.lineTo(w-rr,0); ctx.quadraticCurveTo(w,0,w,rr); ctx.lineTo(w,h-rr); ctx.quadraticCurveTo(w,h,w-rr,h); ctx.lineTo(rr,h); ctx.quadraticCurveTo(0,h,0,h-rr); ctx.lineTo(0,rr); ctx.quadraticCurveTo(0,0,rr,0); }
      ctx.clip(); ctx.drawImage(img,0,0,w,h); ctx.restore();
    }
  }
  $('#rrd',root).addEventListener('input',e=>{ r=+e.target.value; $('#rrdv',root).textContent=r+' px'; draw(); });
  segBind(root,'#rshape',v=>{ shape=v; draw(); });
  onPick(api,draw);
  const old=root.querySelector('[data-iw-save]');
  old.onclick=()=>api.save('image/png');
}

/* ---------- 图片取主色 ---------- */
function t_imgpalette(root){
  const api=imgTool(root,`<p class="hint" style="margin-top:10px">选图后自动提取 8 个主色，点色块即可复制色值，配色、做 PPT 取色都好用。</p>`,'主色');
  const save=root.querySelector('[data-iw-save]'); if(save) save.style.display='none';
  const box=document.createElement('div'); box.className='box';
  box.innerHTML=`<p class="lbl">主色板</p>
    <div id="palsw" style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px"></div>
    <div class="kv" style="margin-top:12px"><span>平均色</span><b id="paavg">—</b></div>
    <p class="hint">HEX 色值，点一下自动复制。</p>`;
  api.wrap.appendChild(box);
  function analyze(){
    const img=api.img; if(!img) return;
    const c=document.createElement('canvas'); c.width=120; c.height=Math.max(1,Math.round(120*img.naturalHeight/img.naturalWidth));
    const ctx=c.getContext('2d'); ctx.drawImage(img,0,0,c.width,c.height);
    const d=ctx.getImageData(0,0,c.width,c.height).data;
    const buckets=new Map(); let ar=0,ag=0,ab=0,n=0;
    for(let i=0;i<d.length;i+=4){
      const r=d[i],g=d[i+1],bl=d[i+2],a=d[i+3];
      if(a<200) continue;
      ar+=r; ag+=g; ab+=bl; n++;
      const k=((r>>5)<<6)|((g>>5)<<3)|(bl>>5);
      const cur=buckets.get(k)||{r:0,g:0,b:0,c:0};
      cur.r+=r; cur.g+=g; cur.b+=bl; cur.c++;
      buckets.set(k,cur);
    }
    const hex=v=>'#'+[v.r,v.g,v.b].map(x=>Math.round(x).toString(16).padStart(2,'0')).join('').toUpperCase();
    const top=Array.from(buckets.values()).sort((x,y)=>y.c-x.c).slice(0,8);
    box.querySelector('#palsw').innerHTML=top.map(v=>{
      const h=hex({r:v.r/v.c,g:v.g/v.c,b:v.b/v.c});
      return `<button data-hex="${h}" style="border:0;border-radius:10px;overflow:hidden;padding:0;background:${h};height:62px;cursor:pointer">
        <span style="display:block;margin-top:40px;background:rgba(255,255,255,.88);font-size:11px;padding:3px 0;color:#15181D">${h}</span></button>`;
    }).join('');
    box.querySelector('#paavg').textContent = n? hex({r:ar/n,g:ag/n,b:ab/n}) : '—';
  }
  root.addEventListener('click',e=>{ const b=e.target.closest('[data-hex]'); if(b) copyText(b.dataset.hex); });
  onPick(api,analyze);
}

/* ---------- 老照片效果 ---------- */
function t_imgvintage(root){
  const api=imgTool(root,`
    <div class="lbl" style="display:flex;justify-content:space-between;margin-top:12px"><span>复古强度</span><b id="vgv" style="color:var(--ink)">70%</b></div>
    <input type="range" id="vg" min="10" max="100" value="70">
    <p class="hint">棕调 + 暗角 + 颗粒，做出老照片、胶片感。想更旧可以把强度拉满。</p>`,'老照片');
  let k=70;
  function draw(){
    const img=api.img; if(!img) return;
    const s=Math.min(1, api.max/img.naturalWidth);
    const w=Math.round(img.naturalWidth*s), h=Math.round(img.naturalHeight*s);
    const cv=api.cv; cv.width=w; cv.height=h;
    const ctx=cv.getContext('2d');
    ctx.filter=`sepia(${(k/100*0.9).toFixed(2)}) contrast(${(1+k/300).toFixed(2)}) saturate(${(1-k/400).toFixed(2)})`;
    ctx.drawImage(img,0,0,w,h);
    ctx.filter='none';
    const g=ctx.createRadialGradient(w/2,h/2,Math.min(w,h)*0.25,w/2,h/2,Math.max(w,h)*0.78);
    g.addColorStop(0,'rgba(0,0,0,0)'); g.addColorStop(1,`rgba(40,26,12,${(k/100*0.55).toFixed(2)})`);
    ctx.fillStyle=g; ctx.fillRect(0,0,w,h);
    if(k>40){
      const n=Math.round(w*h*0.0006), d=ctx.getImageData(0,0,w,h);
      for(let i=0;i<n;i++){
        const x=Math.random()*w|0, y=Math.random()*h|0, idx=(y*w+x)*4, v=(Math.random()-.5)*40;
        d.data[idx]+=v; d.data[idx+1]+=v; d.data[idx+2]+=v;
      }
      ctx.putImageData(d,0,0);
    }
  }
  $('#vg',root).addEventListener('input',e=>{ k=+e.target.value; $('#vgv',root).textContent=k+'%'; draw(); });
  onPick(api,draw);
}

function copyBind(root){

  const DG='零壹贰叁肆伍陆柒捌玖';
  function upper(v){
    if(!isFinite(v)) return '—';
    if(v<0) return '负'+upper(-v);
    const cents=Math.round(v*100);
    if(cents===0) return '零元整';
    const ints=Math.floor(cents/100), frac=cents%100;
    let out='';
    if(ints>0){
      const s=String(ints); const units=['','拾','佰','仟'];
      const bigs=['','万','亿','万亿','亿亿'];
      let zero=false;
      for(let i=0;i<s.length;i++){
        const pos=s.length-1-i, d=+s[i];
        if(d===0){ zero=true; }
        else{
          if(zero && out) out+='零';
          zero=false;
          out+=DG[d]+units[pos%4];
        }
        if(pos%4===0 && pos>0 && bigs[pos/4]){ if(out) out+=bigs[pos/4]; }
      }
      out+='元';
    }
    if(frac===0){ out+='整'; }
    else{
      const j=Math.floor(frac/10), f=frac%10;
      if(j) out+=DG[j]+'角';
      else if(f) out+='零';
      if(f) out+=DG[f]+'分';
    }
    return out;
  }
  function calc(){ $('#rout',root).textContent=upper(parseFloat($('#ra',root).value)); }
  $('#ra',root).addEventListener('input',calc);
  root.addEventListener('click',e=>{ const b=e.target.closest('[data-rmb]'); if(b){ $('#ra',root).value=b.dataset.rmb; calc(); } });

}

/* ---------- 中文数字 ---------- */
function t_cnnum(root){
  root.innerHTML=`
    <div class="box">
      <p class="lbl">输入</p>
      <input type="text" id="nin" value="20261024" placeholder="数字或中文数字">
      <div class="seg" id="nmode"><button class="on" data-v="toCn">数字→中文</button><button data-v="toNum">中文→数字</button></div>
      <button class="btn block" id="ngo" style="margin-top:10px">转换</button>
    </div>
    ${txtOut('结果','nout')}
    <p class="hint">支持到万亿级，「壹佰贰拾叁万」这类写法也能反向识别。</p>`;
  let mode='toCn';
  const DG='零一二三四五六七八九';
  function toCn(n){
    if(!isFinite(n)) return '—';
    if(n<0) return '负'+toCn(-n);
    n=Math.floor(n);
    if(n===0) return '零';
    const units=['','十','百','千'], bigs=['','万','亿','万亿'];
    const s=String(n); let out='', zero=false;
    for(let i=0;i<s.length;i++){
      const pos=s.length-1-i, d=+s[i];
      if(d===0) zero=true;
      else{
        if(zero&&out) out+='零';
        zero=false;
        out+=DG[d]+units[pos%4];
      }
      if(pos%4===0 && pos>0){ if(out&&bigs[pos/4]) out+=bigs[pos/4]; }
    }
    return out.replace(/^一十/,'十');
  }
  function toNum(t){
    t=t.trim().replace(/兩|两/g,'二');
    const dmap={'零':0,'〇':0,'一':1,'二':2,'三':3,'四':4,'五':5,'六':6,'七':7,'八':8,'九':9};
    const umap={'十':10,'百':100,'千':1000,'万':10000,'亿':100000000,'万亿':1e12};
    if(/^-?\d+(\.\d+)?$/.test(t)) return parseFloat(t);
    let total=0, section=0, num=0, seen=false;
    for(const ch of t){
      if(ch in dmap){ num=dmap[ch]; seen=true; }
      else if(ch in umap){
        const u=umap[ch];
        if(u>=10000){ section=(section+num)*u; total+=section; section=0; num=0; }
        else { section += (num||1)*u; num=0; }
        seen=true;
      }else if(ch==='点'){ break; }
      else return NaN;
    }
    const r=total+section+num;
    return seen?r:NaN;
  }
  function run(){
    const v=$('#nin',root).value.trim();
    if(mode==='toCn'){
      const n=toNum(v)? toNum(v) : parseFloat(v);
      $('#nout',root).textContent=toCn(n);
    }else{
      const n=toNum(v);
      $('#nout',root).textContent=isNaN(n)?'无法识别':'= '+n.toLocaleString();
    }
  }
  segBind(root,'#nmode',v=>{ mode=v; run(); });
  $('#ngo',root).onclick=run;
  $('#nin',root).addEventListener('keydown',e=>{ if(e.key==='Enter') run(); });
  copyBind(root); run();
}

/* ---------- 科学计算器 ---------- */
function t_calc(root){
  const keys=[
    ['C','⌫','(',' )'.trim()],['7','8','9','÷'],['4','5','6','×'],['1','2','3','-'],['0','.','%','+'],
    ['π','^','√','=']
  ];
  root.innerHTML=`
    <div class="box" style="padding:0;overflow:hidden">
      <div id="cdisp" style="min-height:74px;padding:14px 16px;font-size:26px;font-weight:600;text-align:right;word-break:break-all;font-variant-numeric:tabular-nums">0</div>
      <div id="chist" style="padding:0 16px 10px;font-size:12.5px;color:var(--sub);text-align:right;min-height:16px"></div>
    </div>
    <div class="box" style="padding:8px">
      <div id="ckey" style="display:grid;grid-template-columns:repeat(4,1fr);gap:7px">
        ${keys.flat().map(k=>`<button data-k="${k}" style="height:48px;border:0;border-radius:11px;font-size:16px;font-weight:600;cursor:pointer;
          background:${'=C⌫()÷×-+%^√π.'.includes(k)?'#EEF1F5':'#FFFFFF'};color:${k==='='?'#fff':'#15181D'};
          ${k==='='?'background:#2C63F0;':''}">${k}</button>`).join('')}
      </div>
    </div>
    <div class="box">
      <div class="row">
        <button class="btn ghost" data-fn="sin">sin</button>
        <button class="btn ghost" data-fn="cos">cos</button>
        <button class="btn ghost" data-fn="tan">tan</button>
        <button class="btn ghost" data-fn="sqrt">√</button>
      </div>
      <div class="row" style="margin-top:8px">
        <button class="btn ghost" data-fn="log">log</button>
        <button class="btn ghost" data-fn="ln">ln</button>
        <button class="btn ghost" data-fn="abs">abs</button>
        <button class="btn ghost" data-fn="deg">角度制</button>
      </div>
    </div>`;
  let expr='0', deg=false;
  const disp=$('#cdisp',root), hist=$('#chist',root);
  function show(v){ disp.textContent=v; }
  function push(k){
    if(k==='C'){ expr='0'; hist.textContent=''; }
    else if(k==='⌫'){ expr=expr.length>1?expr.slice(0,-1):'0'; }
    else if(k==='='){ evaluate(); return; }
    else if(k==='π'){ expr=(expr==='0'?'':expr)+'π'; }
    else if(k==='√'){ expr+='sqrt('; }
    else if(k==='÷'){ expr+='÷'; }
    else if(k==='×'){ expr+='×'; }
    else if(k==='-'){ expr+='-'; }
    else if(k==='+'){ expr+='+'; }
    else if(k==='%'){ expr+='/100'; }
    else if(k==='^'){ expr+='^'; }
    else { expr = expr==='0' && /[0-9.]/.test(k) ? k : expr+k; }
    show(expr);
  }
  function evaluate(){
    const need=(expr.match(/\(/g)||[]).length-(expr.match(/\)/g)||[]).length;
    if(need>0) expr=expr+')'.repeat(need);
    const raw=expr;
    const okChars=/^[0-9+\-*/().^%π√e ]+(sin|cos|tan|log|ln|abs|sqrt|deg)?[0-9+\-*/().^%π√e ]*$/;
    let src=expr.replace(/π/g,'Math.PI').replace(/√/g,'Math.sqrt').replace(/÷/g,'/').replace(/×/g,'*').replace(/\^/g,'**');
    if(deg) src=src.replace(/\b(sin|cos|tan)\(([^()]*)\)/g,(m,f,a)=>f+'('+a+'*Math.PI/180)');
    const allow=src.replace(/Math\.PI|Math\.sqrt|\b(sqrt|sin|cos|tan|log|ln|abs)\b/g,'');
    try{
      if(!/^[0-9+\-*/().%^eE ]*$/.test(allow)) throw 0;
      const f=new Function('Math','with(Math){return ('+src+')}');
      let r=f(Math);
      if(typeof r!=='number'||!isFinite(r)) throw 0;
      hist.textContent=raw+' =';
      expr=String(Math.round(r*1e10)/1e10);
      show(expr);
    }catch(e){ hist.textContent='表达式有误'; }
  }
  root.addEventListener('click',e=>{
    const b=e.target.closest('[data-k]'); if(b){ push(b.dataset.k); return; }
    const f=e.target.closest('[data-fn]');
    if(f){
      const fn=f.dataset.fn;
      if(fn==='deg'){ deg=!deg; f.textContent=deg?'弧度制':'角度制'; f.classList.toggle('on'); return; }
      if(expr==='0') expr='';
      const join=()=> (/[0-9π)]$/.test(expr) ? '+' : '');
      if(fn==='sqrt'){ expr+= join()+'sqrt('; show(expr); return; }
      expr+= join()+fn+'('; show(expr);
    }
  });
  show('0');
  return ()=>{};
}

/* ---------- 体脂率 ---------- */
function t_bodyfat(root){
  root.innerHTML=`
    <div class="box">
      <div class="row">
        <div><p class="lbl">性别</p><select id="fsx"><option value="m">男</option><option value="f">女</option></select></div>
        <div><p class="lbl">年龄</p><input type="number" id="fage" value="30" min="10" max="100"></div>
      </div>
      <div class="row" style="margin-top:10px">
        <div><p class="lbl">身高 cm</p><input type="number" id="fh" value="175" inputmode="decimal"></div>
        <div><p class="lbl">体重 kg</p><input type="number" id="fw" value="70" step="0.1" inputmode="decimal"></div>
      </div>
      <div class="row" style="margin-top:10px">
        <div><p class="lbl">腰围 cm（可选，更准）</p><input type="number" id="fl" value="0" inputmode="decimal"></div>
      </div>
    </div>
    <div class="box" id="fres"></div>`;
  function run(){
    const sx=$('#fsx',root).value, age=+$('#fage',root).value||30, h=+$('#fh',root).value||0, w=+$('#fw',root).value||0, wa=+$('#fl',root).value||0;
    const bmi = w/((h/100)*(h/100));
    let bf = 1.2*bmi + 0.23*age - 10.8*(sx==='m'?1:0) - 5.4;
    let method='Deurenberg（BMI 推算）';
    if(wa>0 && h>0){
      // US Navy 公式（腰围 cm，男按颈围近似 38，女按臀围近似腰围 1.05）
      const log10=Math.log10;
      if(sx==='m'){
        bf = 495/(1.0324 - 0.19077*log10(wa-38) + 0.15456*log10(h)) - 450;
      }else{
        bf = 495/(1.29579 - 0.35004*log10(wa+wa*0.05-38) + 0.22100*log10(h)) - 450;
      }
      method='US Navy（腰围近似）';
    }
    bf=Math.max(3,Math.min(60,bf));
    const fat=w*bf/100, lean=w-fat;
    let level='';
    if(sx==='m') level = bf<6?'偏低（运动员级）': bf<14?'偏瘦': bf<18?'健康': bf<25?'偏高': '肥胖';
    else level = bf<14?'偏低（运动员级）': bf<21?'偏瘦': bf<25?'健康': bf<32?'偏高': '肥胖';
    $('#fres',root).innerHTML=`
      <div class="kv"><span>BMI</span><b>${bmi.toFixed(1)}</b></div>
      <div class="kv"><span>体脂率</span><b style="color:#17A673;font-size:18px">${bf.toFixed(1)}% · ${level}</b></div>
      <div class="kv"><span>脂肪量</span><b>${fat.toFixed(1)} kg</b></div>
      <div class="kv"><span>去脂体重</span><b>${lean.toFixed(1)} kg</b></div>
      <p class="hint">推算方法：${method}。家用体脂秤和公式都会有误差，看趋势比看单次数值更有意义。</p>`;
  }
  ['#fsx','#fage','#fh','#fw','#fl'].forEach(id=>$(id,root).addEventListener('input',run));
  run();
}

/* ---------- 两点距离 ---------- */
function t_geodist(root){
  root.innerHTML=`
    <div class="box">
      <p class="lbl">起点</p>
      <div class="row">
        <input type="number" id="glat1" placeholder="纬度 如 30.7" step="0.000001" inputmode="decimal">
        <input type="number" id="glon1" placeholder="经度 如 111.3" step="0.000001" inputmode="decimal">
      </div>
      <p class="lbl" style="margin-top:10px">终点</p>
      <div class="row">
        <input type="number" id="glat2" placeholder="纬度" step="0.000001" inputmode="decimal">
        <input type="number" id="glon2" placeholder="经度" step="0.000001" inputmode="decimal">
      </div>
      <div class="row" style="margin-top:10px">
        <button class="btn ghost" id="gmy">用当前位置</button>
        <button class="btn" id="ggo">计算</button>
      </div>
    </div>
    <div class="box" id="gres"></div>
    <p class="hint">直线距离（球面大圆距离），不是道路里程。做工程放样、判断两个点远近够用了。</p>`;
  $('#gmy',root).onclick=()=>{
    if(!navigator.geolocation) return toast('本机不支持定位');
    navigator.geolocation.getCurrentPosition(p=>{
      $('#glat1',root).value=p.coords.latitude.toFixed(6);
      $('#glon1',root).value=p.coords.longitude.toFixed(6);
      toast('已填入当前位置');
    },()=>toast('定位失败，请允许权限'));
  };
  $('#ggo',root).onclick=()=>{
    const a1=+$('#glat1',root).value, b1=+$('#glon1',root).value, a2=+$('#glat2',root).value, b2=+$('#glon2',root).value;
    if([a1,b1,a2,b2].some(v=>!isFinite(v))) return toast('请填完整经纬度');
    const R=6371.0088, rad=Math.PI/180;
    const dA=(a2-a1)*rad, dB=(b2-b1)*rad;
    const h=Math.sin(dA/2)**2 + Math.cos(a1*rad)*Math.cos(a2*rad)*Math.sin(dB/2)**2;
    const d=2*R*Math.asin(Math.sqrt(h));
    const brng=(Math.atan2(Math.sin(dB)*Math.cos(a2*rad), Math.cos(a1*rad)*Math.sin(a2*rad)-Math.sin(a1*rad)*Math.cos(a2*rad)*Math.cos(dB))*180/Math.PI+360)%360;
    $('#gres',root).innerHTML=`
      <div class="kv"><span>直线距离</span><b style="color:#17A673;font-size:18px">${d<1?(d*1000).toFixed(0)+' m':d.toFixed(2)+' km'}</b></div>
      <div class="kv"><span>方位角</span><b>${brng.toFixed(1)}°</b></div>
      <div class="kv"><span>经度差 / 纬度差</span><b>${Math.abs(b2-b1).toFixed(5)}° / ${Math.abs(a2-a1).toFixed(5)}°</b></div>`;
  };
}

function t_tzconv(root){
  const zones=[
    ['北京 / 上海','Asia/Shanghai'],['香港','Asia/Hong_Kong'],['东京','Asia/Tokyo'],['首尔','Asia/Seoul'],
    ['新加坡','Asia/Singapore'],['迪拜','Asia/Dubai'],['伦敦','Europe/London'],['巴黎 / 柏林','Europe/Paris'],
    ['莫斯科','Europe/Moscow'],['纽约','America/New_York'],['芝加哥','America/Chicago'],['洛杉矶','America/Los_Angeles'],
    ['悉尼','Australia/Sydney'],['圣保罗','America/Sao_Paulo']
  ];
  root.innerHTML=`
    <div class="box">
      <p class="lbl">基准时间（本机时区）</p>
      <input type="text" id="tdt" placeholder="2026-11-12 20:30">
      <div class="row" style="margin-top:10px">
        <button class="btn ghost" id="tnow">用当前时间</button>
        <button class="btn" id="tgo">换算</button>
      </div>
    </div>
    <div class="box" id="tres"></div>`;
  function nowStr(){
    const d=new Date(), p=n=>String(n).padStart(2,'0');
    return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
  }
  $('#tnow',root).onclick=()=>{ $('#tdt',root).value=nowStr(); $('#tgo',root).click(); };
  $('#tgo',root).onclick=()=>{
    const v=$('#tdt',root).value.trim();
    const d=new Date(v.replace(/\s/,'T'));
    if(isNaN(d)) return toast('时间格式不对，例如 2026-11-12 20:30');
    $('#tres',root).innerHTML=zones.map(([n, z])=>{
      const f=new Intl.DateTimeFormat('zh-CN',{timeZone:z, month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit', weekday:'short', hour12:false});
      const parts=f.formatToParts(d);
      const get=t=>{ const q=parts.find(p=>p.type===t); return q?q.value:''; };
      const hh=+get('hour');
      const diff=(hh - d.getHours() + 24)%24;
      return `<div class="kv"><span>${n} ${diff===0?'（同一天）':diff<12?`+${diff}h`:''}</span><b>${get('month')}-${get('day')} ${get('hour')}:${get('minute')}</b></div>`;
    }).join('');
  };
  $('#tdt',root).value=nowStr();
  $('#tgo',root).click();
}

function t_wheel(root){
  root.innerHTML=`
    <div class="box" style="padding:0;overflow:hidden;background:#FAFBFC">
      <canvas id="wcv" style="width:100%;height:300px;display:block"></canvas>
    </div>
    <div class="box">
      <textarea id="witems" style="min-height:88px">火锅\n烧烤\n日料\n炒菜\n外卖</textarea>
      <div class="row" style="margin-top:10px">
        <button class="btn" id="wspin">开始转</button>
        <button class="btn ghost" id="wapply">应用选项</button>
      </div>
      <p class="hint" id="wres">点「开始转」，指针停在哪个就是哪个。</p>
    </div>`;
  const COL=['#2C63F0','#17A673','#E2543B','#F0A22B','#7A5AF8','#0E9AA7','#D9822B','#5B7CFA'];
  let items=['火锅','烧烤','日料','炒菜','外卖'], ang=0, spinning=false;
  function read(){ return $('#witems',root).value.split('\n').map(s=>s.trim()).filter(Boolean).slice(0,12); }
  function draw(){
    const cv=$('#wcv',root), w=cv.clientWidth||320, h=300, dpr=Math.min(2,window.devicePixelRatio||1);
    cv.width=w*dpr; cv.height=h*dpr; const ctx=cv.getContext('2d'); ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.clearRect(0,0,w,h);
    const cx=w/2, cy=h/2, R=Math.min(w,h)/2-12, n=items.length, step=Math.PI*2/n;
    for(let i=0;i<n;i++){
      ctx.beginPath(); ctx.moveTo(cx,cy);
      ctx.arc(cx,cy,R, ang+i*step, ang+(i+1)*step);
      ctx.fillStyle=COL[i%COL.length]; ctx.fill();
      ctx.strokeStyle='rgba(255,255,255,.85)'; ctx.lineWidth=2; ctx.stroke();
      ctx.save();
      ctx.translate(cx,cy); ctx.rotate(ang+(i+.5)*step);
      ctx.fillStyle='#fff'; ctx.font='600 14px -apple-system,sans-serif'; ctx.textAlign='center';
      ctx.fillText(items[i].slice(0,7), R*0.62, 5);
      ctx.restore();
    }
    ctx.beginPath(); ctx.moveTo(cx-9,12); ctx.lineTo(cx+9,12); ctx.lineTo(cx,30); ctx.fillStyle='#15181D'; ctx.fill();
    ctx.beginPath(); ctx.arc(cx,cy,15,0,7); ctx.fillStyle='#fff'; ctx.fill(); ctx.strokeStyle='#DDE2E9'; ctx.stroke();
  }
  function spin(){
    if(spinning) return;
    if(items.length<2) return toast('至少两个选项');
    spinning=true; $('#wres',root).textContent='转动中…';
    const target=ang + Math.PI*2*(4+Math.random()*3) + Math.random()*Math.PI*2;
    const start=ang, dur=3600, t0=performance.now();
    const ease=t=>1-Math.pow(1-t,4);
    const step=now=>{
      const k=Math.min(1,(now-t0)/dur);
      ang=start+(target-start)*ease(k); draw();
      if(k<1) requestAnimationFrame(step);
      else{
        spinning=false;
        // 指针在正上方（-90°），换算落点
        const step2=Math.PI*2/items.length;
        let idx=Math.floor((((3*Math.PI/2 - ang) % (Math.PI*2))+Math.PI*2)%(Math.PI*2)/step2);
        const r=items[idx]||items[0];
        $('#wres',root).textContent='结果：'+r;
        toast('抽中了：'+r);
      }
    };
    requestAnimationFrame(step);
  }
  $('#wapply',root).onclick=()=>{ items=read(); if(!items.length) items=['选项一','选项二']; draw(); $('#wres',root).textContent='已更新 '+items.length+' 个选项'; };
  $('#wspin',root).onclick=()=>{ items=read(); if(items.length) draw(); spin(); };
  draw();
  return ()=>{};
}

function t_pwdgen(root){

      </div>

    </div>

  function chars(){
    let s='';
    const on=k=>{ const c=root.querySelector(`[data-c="${k}"]`); return c&&c.checked; };
    if(on('lower')) s+='abcdefghijklmnopqrstuvwxyz';
    if(on('upper')) s+='ABCDEFGHIJKLMNOPQRSTUVWXYZ';

    if(on('sym')) s+='!@#$%^&*()-_=+[]{}';
    if(on('safe')) s=s.replace(/[0O1lI]/g,'');
    return s||'abcdefghijklmnopqrstuvwxyz';
  }

  $('#pgen',root).onclick=()=>{

    let out='';
    for(let i=0;i<5;i++){
      let pw='';

    root.querySelectorAll('[data-pw]').forEach(b=>b.onclick=()=>copyText(b.dataset.pw));
  };

}

  function save(){ localStorage.setItem('tb_habit',JSON.stringify(data)); }
  function streak(h){
    let n=0, d=new Date();
    while(true){
      const k=key(d);
      if(data[h]&&data[h][k]){ n++; d.setDate(d.getDate()-1); }

    }
    return n;
  }
  function render(){
    const hs=Object.keys(data);
    if(!hs.length){ $('#hlist',root).innerHTML='<p class="hint" style="margin:0">先添加一个习惯</p>'; return; }

          <button data-del-h="${h}" style="border:0;background:transparent;color:#B7BEC8;font-size:16px;cursor:pointer">×</button>
        </div>
        <div style="display:flex;gap:6px;margin-top:8px">
          ${days.map(d=>{
            const k=key(d), on=!!(data[h]&&data[h][k]);
            return `<button data-h="${h}" data-k="${k}" style="flex:1;height:40px;border:0;border-radius:9px;font-size:12px;cursor:pointer;

          }).join('')}
        </div>
      </div>`).join('');
  }
  $('#hadd',root).onclick=()=>{
    const h=$('#hname',root).value.trim(); if(!h) return toast('写个习惯名');
    if(!data[h]) data[h]={}; $('#hname',root).value=''; save(); render();
  };
  $('#hlist',root).addEventListener('click',e=>{
    const d=e.target.closest('[data-del-h]');
    if(d){ delete data[d.dataset.delH]; save(); render(); return; }
    const b=e.target.closest('[data-h]');
    if(b){ const h=b.dataset.h, k=b.dataset.k; data[h]=data[h]||{}; if(data[h][k]) delete data[h][k]; else data[h][k]=1; save(); render(); }
  });
  $('#hclear',root).onclick=()=>{ data={}; save(); render(); };
  render();
}

function t_roman(root){
  root.innerHTML=`
    <div class="box">

      <div class="row" style="margin-top:10px">

        <button class="btn ghost" id="r2n">罗马→数字</button>
      </div>
    </div>
    ${txtOut('结果','rout2')}
    <p class="hint">支持 1–3999，适合写年份、章节编号、版权年份。</p>`;
  const M=[['M',1000],['CM',900],['D',500],['CD',400],['C',100],['XC',90],['L',50],['XL',40],['X',10],['IX',9],['V',5],['IV',4],['I',1]];
  function toRoman(n){
    if(!(n>0&&n<4000)) return '超出范围';
    let s='';
    for(const [k,v] of M){ while(n>=v){ s+=k; n-=v; } }
    return s;
  }
  function toNum(t){
    t=t.toUpperCase().replace(/[^IVXLCDM]/g,'');
    const map={I:1,V:5,X:10,L:50,C:100,D:500,M:1000};
    let total=0;
    for(let i=0;i<t.length;i++){
      const v=map[t[i]], next=map[t[i+1]]||0;
      total += v<next? -v : v;
    }
    return total;
  }
  $('#r2r',root).onclick=()=>{ const n=parseInt($('#rin2',root).value,10); $('#rout2',root).textContent=toRoman(n); };
  $('#r2n',root).onclick=()=>{ $('#rout2',root).textContent=String(toNum($('#rin2',root).value)); };
  copyBind(root);
  $('#r2r',root).click();
}

/* ---------- JWT 解析 ---------- */
function t_jwt(root){
  root.innerHTML=`
    <div class="box">
      <textarea id="jin" placeholder="粘贴 JWT（eyJhbGci... 三段）" style="min-height:92px;font-size:12.5px"></textarea>
      <div class="row" style="margin-top:10px">
        <button class="btn" id="jgo">解析</button>
        <button class="btn ghost" id="jclr">清空</button>
      </div>
    </div>
    <div class="box" id="jout"></div>
    <p class="hint">只在本地解码，不联网校验签名，看 payload 字段和过期时间够用。</p>`;
  function b64url(s){
    s=s.replace(/-/g,'+').replace(/_/g,'/');
    while(s.length%4) s+='=';
    const bin=atob(s);
    try{ return decodeURIComponent(Array.from(bin).map(c=>'%'+c.charCodeAt(0).toString(16).padStart(2,'0')).join('')); }
    catch(e){ return bin; }
  }
  $('#jgo',root).onclick=()=>{
    const raw=$('#jin',root).value.trim().replace(/^Bearer\s+/i,'');
    const parts=raw.split('.');
    if(parts.length<2){ $('#jout',root).innerHTML='<p class="hint">不是有效的 JWT（应有 2–3 段以点分隔）</p>'; return; }
    let head, body;
    try{ head=JSON.parse(b64url(parts[0])); body=JSON.parse(b64url(parts[1])); }
    catch(e){ $('#jout',root).innerHTML='<p class="hint">解码失败，确认复制完整</p>'; return; }
    let expInfo='没有 exp 字段';
    if(body.exp){
      const d=new Date(body.exp*1000), left=body.exp*1000-Date.now();
      expInfo = left>0 ? `有效期至 ${d.toLocaleString()}（还剩 ${Math.round(left/60000)} 分钟）` : `已于 ${d.toLocaleString()} 过期`;
    }
    const pre=o=>`<pre style="background:#F7F9FC;border-radius:10px;padding:12px;font-size:12px;overflow:auto;margin:0 0 12px">${JSON.stringify(o,null,2).replace(/</g,'&lt;')}</pre>`;
    $('#jout',root).innerHTML=`<p class="lbl">Header</p>${pre(head)}<p class="lbl">Payload</p>${pre(body)}
      <div class="kv"><span>签名段</span><b>${parts[2]?'有（'+parts[2].length+' 字符）':'无'}</b></div>
      <div class="kv"><span>过期情况</span><b style="color:${body.exp&&body.exp*1000<Date.now()?'#E2543B':'#17A673'}">${expInfo}</b></div>`;
  };
  $('#jin',root).addEventListener('input',()=>{ if($('#jin',root).value.trim().length>20) $('#jgo',root).click(); });
  $('#jclr',root).onclick=()=>{ $('#jin',root).value=''; $('#jout',root).innerHTML=''; };
}

function t_mdpreview(root){
  root.innerHTML=`
    <div class="box">

**加粗** 和 *斜体*，还有 \`行内代码\`。

    <p class="hint">支持标题、加粗斜体、列表、引用、代码块、链接；表格、脚注等复杂语法不处理。</p>`;
  function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  function render(src){
    const cbs=[];
    src=src.replace(/```([\s\S]*?)```/g, (m,c)=>{ cbs.push(c.replace(/^\n/,'')); return '@@CB'+(cbs.length-1)+'@@'; });
    const lines=esc(src).split('\n');
    let out='', inList=false;
    const closeList=()=>{ if(inList){ out+='</ul>'; inList=false; } };
    lines.forEach(line=>{
      const mcb=line.trim().match(/^@@CB(\d+)@@$/);
      if(mcb){ closeList(); out+='<pre style="background:#F7F9FC;border-radius:10px;padding:12px;font-size:12.5px;overflow:auto">'+esc(cbs[+mcb[1]])+'</pre>'; return; }
      if(/^#{1,4}\s+/.test(line)){
        closeList();
        const lv=line.match(/^#+/)[0].length;
        const size=[0,22,19,17,15][lv];
        out+='<h'+lv+' style="margin:14px 0 6px;font-size:'+size+'px">'+line.replace(/^#+\s+/,'')+'</h'+lv+'>';
        return;
      }
      if(/^[-*]\s+/.test(line)){
        if(!inList){ out+='<ul style="padding-left:18px;margin:6px 0">'; inList=true; }
        out+='<li>'+line.replace(/^[-*]\s+/,'')+'</li>';
        return;
      }
      closeList();
      if(/^&gt;\s+/.test(line)){ out+='<blockquote style="border-left:3px solid #DDE2E9;padding-left:10px;color:#6E7580;margin:8px 0">'+line.replace(/^&gt;\s+/,'')+'</blockquote>'; return; }
      if(/^-{3,}$/.test(line.trim())){ out+='<hr style="border:0;border-top:1px dashed #E5E8EC;margin:12px 0">'; return; }
      if(line.trim()===''){ out+='<div style="height:8px"></div>'; return; }
      out+='<p style="margin:6px 0">'+line+'</p>';
    });
    closeList();
    out=out.replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>');
    out=out.replace(/\*([^*<>]+)\*/g,'<i>$1</i>');
    out=out.replace(/(^|[^`])\`([^`]+)\`/g,'$1<code style="background:#F2F4F7;border-radius:4px;padding:1px 4px;font-size:12.5px">$2</code>');
    out=out.replace(/\[([^\]]+)\]\((https?:[^)]+)\)/g,'<a href="$2" target="_blank" rel="noopener" style="color:#2C63F0">$1</a>');
    return out;
  }
  $('#mgo',root).onclick=()=>{ $('#mout',root).innerHTML=render($('#min',root).value); };
  $('#mgo',root).click();
}

/* ---------- 密码强度 ---------- */
function t_pwstrength(root){
  root.innerHTML=`
    <div class="box">
      <input type="text" id="pwi" placeholder="输入密码，边输入边评估">
      <div style="height:8px;border-radius:8px;background:#EEF1F5;margin-top:12px;overflow:hidden">
        <div id="pwbar" style="height:100%;width:0;background:#E2543B;transition:width .2s,background .2s"></div>
      </div>
      <div class="kv" style="margin-top:8px"><span>强度</span><b id="pwlv">—</b></div>
      <div class="kv"><span>估算熵值</span><b id="pwbits">—</b></div>
      <div class="kv"><span>离线破解估计</span><b id="pwcrack">—</b></div>
    </div>
    <div class="box" id="pwtips"></div>
    <p class="hint">按字符集与长度估算，只作参考；真实安全性还取决于是否被撞库、是否长期不换。</p>`;
  function calc(){
    const p=$('#pwi',root).value;
    let set=0;
    if(/[a-z]/.test(p)) set+=26;
    if(/[A-Z]/.test(p)) set+=26;
    if(/[0-9]/.test(p)) set+=10;
    if(/[^a-zA-Z0-9]/.test(p)) set+=33;
    if(!p){ $('#pwbar',root).style.width='0'; $('#pwlv',root).textContent='—'; $('#pwbits',root).textContent='—'; $('#pwcrack',root).textContent='—'; $('#pwtips',root).innerHTML=''; return; }
    const bits = p.length*Math.log2(set||1);
    let lv='弱', col='#E2543B';
    if(bits>=90){ lv='很强'; col='#17A673'; } else if(bits>=65){ lv='强'; col='#0E9AA7'; } else if(bits>=45){ lv='中'; col='#F0A22B'; }
    $('#pwbar',root).style.width=Math.min(100,bits)+'%'; $('#pwbar',root).style.background=col;
    $('#pwlv',root).textContent=lv+'（'+p.length+' 位）';
    $('#pwbits',root).textContent=bits.toFixed(0)+' bit';
    // 假设攻击者每秒 10^9 次尝试
    const guesses=Math.pow(2,bits)/2;
    const secs=guesses/1e9;
    const fmt=s=>{
      if(s<1) return '一瞬';
      if(s<60) return s.toFixed(0)+' 秒';
      if(s<3600) return (s/60).toFixed(0)+' 分钟';
      if(s<86400) return (s/3600).toFixed(1)+' 小时';
      if(s<2.6e6) return (s/86400).toFixed(0)+' 天';
      if(s<3.15e7) return (s/2.6e6).toFixed(1)+' 个月';
      const y=s/3.15e7;
      if(y<1000) return y.toFixed(0)+' 年';
      if(y<1e6) return (y/1000).toFixed(1)+' 千年';
      return '远超人类历史';
    };
    $('#pwcrack',root).textContent=fmt(secs);
    const tips=[];
    if(p.length<12) tips.push('长度至少 12 位，长度比复杂度更重要');
    if(!/[A-Z]/.test(p)||!/[a-z]/.test(p)) tips.push('混用大小写字母');
    if(!/[0-9]/.test(p)) tips.push('加入数字');
    if(!/[^a-zA-Z0-9]/.test(p)) tips.push('加入符号');
    if(/(123|abc|qwe|password|admin|888)/i.test(p)) tips.push('含有常见弱口令片段');
    if(/(.)\1{2,}/.test(p)) tips.push('避免连续重复字符');
    $('#pwtips',root).innerHTML=(tips.length?tips.map(t=>`<div style="display:flex;gap:8px;padding:6px 0;font-size:13.5px"><span style="color:#E2543B">·</span><span>${t}</span></div>`).join(''):'<p class="hint" style="margin:0">这个密码的构成没有问题</p>');
  }
  $('#pwi',root).addEventListener('input',calc);
}

/* ---------- Cron 解析 ---------- */
function t_cron(root){
  root.innerHTML=`
    <div class="box">
      <input type="text" id="cin2" value="*/30 9-18 * * 1-5">
      <div class="row" style="margin-top:10px">
        <button class="btn" id="cgo2">解析</button>
      </div>
      <p class="hint">五个字段：分 时 日 月 周，支持 * , - /。例如 \`0 9 * * 1\` 表示每周一 9 点。</p>
    </div>
    <div class="box" id="cres2"></div>`;
  const NAMES=[['分',0,59],['时',0,23],['日',1,31],['月',1,12],['周',0,6]];
  function expand(f, min, max){
    const set=new Set();
    f.split(',').forEach(part=>{
      let step=1, base=part;
      if(part.includes('/')){ const [a,b]=part.split('/'); base=a; step=+b||1; }
      let lo=min, hi=max;
      if(base==='*'){}
      else if(base.includes('-')){ const [a,b]=base.split('-'); lo=+a; hi=+b; }
      else { lo=+base; hi=+base; }
      for(let i=lo;i<=hi;i+=step) if(i>=min&&i<=max) set.add(i);
    });
    return [...set].sort((a,b)=>a-b);
  }
  function run(){
    const v=$('#cin2',root).value.trim().replace(/\s+/g,' ');
    const parts=v.split(' ');
    if(parts.length<5){ $('#cres2',root).innerHTML='<p class="hint">需要 5 个字段</p>'; return; }
    let sets;
    try{ sets=parts.map((p,i)=>expand(p, NAMES[i][1], NAMES[i][2])); }
    catch(e){ $('#cres2',root).innerHTML='<p class="hint">表达式解析失败</p>'; return; }
    const [mm,hh,dd,mo,dw]=sets;
    const wd=['周日','周一','周二','周三','周四','周五','周六'];
    const desc=`${mo.length===12?'每月每天':mo.join('、')+' 月的 '+dd.join('、')+' 日'}${dw.length===7?'':('，'+wd.filter((_,i)=>dw.includes(i)).join('、'))}，${hh.join('、')} 点的 ${mm.join('、')} 分执行`;
    // 计算未来 5 次（最多扫描 400 天）
    const list=[], d=new Date(); d.setSeconds(0,0); d.setMinutes(d.getMinutes()+1);
    let guard=0;
    while(list.length<5 && guard<200000){
      guard++;
      if(dw.length===7||dw.includes(d.getDay())){
        if(mo.includes(d.getMonth()+1) && dd.includes(d.getDate()) &&
           hh.includes(d.getHours()) && mm.includes(d.getMinutes())){
          list.push(new Date(d));
          d.setMinutes(d.getMinutes()+Math.max(1, (mm[1]||mm[0])-mm[0]||1));
          continue;
        }
      }
      d.setMinutes(d.getMinutes()+1);
    }
    $('#cres2',root).innerHTML=`
      <div class="kv"><span>表达式</span><b style="font-family:ui-monospace,monospace">${v}</b></div>
      <p style="font-size:13.5px;line-height:1.75;margin:10px 0">${desc}。</p>
      <p class="lbl">未来 5 次运行</p>
      ${list.length?list.map(x=>`<div class="kv"><span>${x.toLocaleDateString()} ${wd[x.getDay()]}</span><b>${String(x.getHours()).padStart(2,'0')}:${String(x.getMinutes()).padStart(2,'0')}</b></div>`).join(''):'<p class="hint">按这个规则最近没有匹配时间（日和周同时限制时按「都满足」处理）</p>'}`;
  }
  $('#cgo2',root).onclick=run;
  run();
}


/* ---------- 批量图片压缩 ---------- */
function t_imgbatch(root){
  root.innerHTML=`
    <div class="box">
      <button class="btn block" id="bbpick">选择多张图片</button>
      <div class="lbl" style="display:flex;justify-content:space-between;margin-top:12px"><span>目标大小上限</span><b id="bbtv" style="color:var(--ink)">500 KB</b></div>
      <input type="range" id="bbt" min="100" max="2000" step="50" value="500">
      <div class="lbl" style="display:flex;justify-content:space-between;margin-top:8px"><span>最长边限制</span><b id="bbmv" style="color:var(--ink)">2000 px</b></div>
      <input type="range" id="bbm" min="800" max="4000" step="100" value="2000">
      <p class="hint">输出为 JPG，逐张二分调质量逼近目标大小；透明背景会变成白底。</p>
    </div>
    <div class="box" id="bblist"><p class="hint" style="margin:0">还没有图片</p></div>
    <div class="box" style="display:none" id="bball"><button class="btn block" id="bbdl">全部下载</button></div>`;
  const done=[];
  $('#bbt',root).addEventListener('input',e=>$('#bbtv',root).textContent=e.target.value+' KB');
  $('#bbm',root).addEventListener('input',e=>$('#bbmv',root).textContent=e.target.value+' px');
  function make(img, maxSide, targetKB){
    const s=Math.min(1, maxSide/Math.max(img.naturalWidth,img.naturalHeight));
    const c=document.createElement('canvas');
    c.width=Math.round(img.naturalWidth*s); c.height=Math.round(img.naturalHeight*s);
    const ctx=c.getContext('2d'); ctx.fillStyle='#fff'; ctx.fillRect(0,0,c.width,c.height); ctx.drawImage(img,0,0,c.width,c.height);
    return new Promise(res=>{
      let q=.85, tries=0;
      const step=()=>{
        c.toBlob(blob=>{
          tries++;
          if(blob.size/1024<=targetKB || q<=.4 || tries>6) return res(blob);
          q-=.12; step();
        },'image/jpeg',q);
      };
      step();
    });
  }
  function render(){
    $('#bblist',root).innerHTML=done.length? done.map((x,i)=>`
      <div style="padding:10px 0;border-bottom:1px dashed var(--line)">
        <div style="display:flex;align-items:center;gap:8px">
          <b style="flex:1;min-width:0;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${x.name}</b>
          <span style="font-size:12px;color:var(--sub)">${x.outW}×${x.outH}</span>
          <button data-dl="${i}" style="border:0;background:#EEF1F5;border-radius:8px;padding:6px 10px;font-size:12.5px;cursor:pointer">下载</button>
        </div>
        <div style="font-size:12.5px;color:var(--sub);margin-top:4px">${bytes(x.before)} → ${bytes(x.after)}${x.before>x.after?'（省 '+Math.round((1-x.after/x.before)*100)+'%）':''}</div>
      </div>`).join(''):'<p class="hint" style="margin:0">还没有图片</p>';
    $('#bball',root).style.display=done.length?'':'none';
  }
  $('#bbpick',root).onclick=async()=>{
    const files=await pickFile('image/*',true); if(!files||!files.length) return;
    const cap=+$('#bbt',root).value, side=+$('#bbm',root).value;
    done.length=0;
    for(const f of files.slice(0,20)){
      try{
        const img=await loadImg(f);
        const blob=await make(img,side,cap);
        const url=URL.createObjectURL(blob);
        const outImg=await loadImgUrl(url);
        done.push({name:f.name.replace(/\.[^.]+$/,'')+'.jpg', before:f.size, after:blob.size, blob, outW:outImg.naturalWidth, outH:outImg.naturalHeight});
        URL.revokeObjectURL(url);
      }catch(e){ done.push({name:f.name+' 压缩失败', before:f.size, after:f.size, blob:f}); }
      render();
    }
    toast('已处理 '+done.length+' 张');
  };
  root.addEventListener('click',e=>{
    const b=e.target.closest('[data-dl]'); if(b){ const x=done[+b.dataset.dl]; download(x.blob,x.name); toast('已保存'); }
  });
  $('#bbdl',root).onclick=()=>{
    done.forEach((x,i)=>setTimeout(()=>download(x.blob,x.name), i*260));
    if(done.length>3) toast('浏览器可能提示「允许多个下载」');
  };
  render();
}

function t_imgascii(root){
  root.innerHTML=`
    <div class="box">
      <button class="btn block" data-iw-pick>选择图片</button>
      <div class="seg" id="ach" style="margin-top:12px"><button class="on" data-v="std">标准密度</button><button data-v="lite">稀疏</button><button data-v="block">方块字符</button></div>
      <div class="lbl" style="display:flex;justify-content:space-between;margin-top:10px"><span>宽度（字符数）</span><b id="awv" style="color:var(--ink)">72</b></div>
      <input type="range" id="aw" min="30" max="120" step="2" value="72">
      <label style="display:flex;gap:10px;align-items:center;padding-top:8px"><input type="checkbox" id="ainv" style="width:20px;height:20px"> 反色（深底浅字）</label>
      <button class="btn ghost block" id="acopy" style="margin-top:10px">复制字符画</button>
      <p class="hint">建议先用「标准密度」看效果；发朋友圈、做签名、贴代码注释都挺好玩。</p>
    </div>
    <div class="box" style="padding:0;overflow:auto">
      <pre id="aout" style="margin:0;padding:14px;font-size:8px;line-height:1;font-family:ui-monospace,Menlo,monospace;color:#15181D;background:#F7F9FC;white-space:pre">—</pre>
    </div>`;
  const SETS={std:'@%#*+=-:. ', lite:'@#=-. ', block:'█▓▒░ '};
  let img=null, set='std', width=72, inv=false;
  function render(){
    if(!img) return;
    const chs=SETS[set];
    const w=Math.max(20,width);
    const h=Math.round(img.naturalHeight/img.naturalWidth*w*0.5);
    const c=document.createElement('canvas'); c.width=w; c.height=h;
    const ctx=c.getContext('2d'); ctx.drawImage(img,0,0,w,h);
    const d=ctx.getImageData(0,0,w,h).data;
    let out='';
    for(let y=0;y<h;y++){
      for(let x=0;x<w;x++){
        const i=(y*w+x)*4;
        let lum=(d[i]*0.299+d[i+1]*0.587+d[i+2]*0.114)/255;
        if(inv) lum=1-lum;
        out+=chs[Math.min(chs.length-1, Math.floor(lum*chs.length))];
      }
      out+='\n';
    }
    $('#aout',root).textContent=out;
  }
  root.querySelector('[data-iw-pick]').onclick=async()=>{
    const f=await pickFile('image/*'); if(!f) return;
    img=await loadImg(f); render();
  };
  segBind(root,'#ach',v=>{ set=v; render(); });
  $('#aw',root).addEventListener('input',e=>{ width=+e.target.value; $('#awv',root).textContent=width; render(); });
  $('#ainv',root).addEventListener('change',e=>{ inv=e.target.checked; render(); });
  $('#acopy',root).onclick=()=>copyText($('#aout',root).textContent);
}

/* ---------- 图片转 PDF ---------- */
function t_img2pdf(root){
  root.innerHTML=`
    <div class="box">
      <button class="btn block" id="pdpick">选择图片（可多张）</button>
      <div class="seg" id="pdsize"><button class="on" data-v="a4">A4 竖版</button><button data-v="fit">按图片尺寸</button></div>
      <p class="hint" id="pdtip">每张图片单独一页，按宽度等比缩放居中。合同、票据、证件照合并成一个 PDF 很好用。</p>
    </div>
    <div class="box" id="pdlist"><p class="hint" style="margin:0">还没有图片</p></div>`;
  let files=[], mode='a4';
  segBind(root,'#pdsize',v=>mode=v);
  function render(){
    $('#pdlist',root).innerHTML=files.length? files.map((f,i)=>`<div class="kv"><span>第 ${i+1} 页</span><b style="max-width:60%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${f.name}</b></div>`).join('')
      +`<button class="btn block" id="pdgo" style="margin-top:12px">生成 PDF</button>` : '<p class="hint" style="margin:0">还没有图片</p>';
    if(files.length) $('#pdgo',root).onclick=run;
  }
  $('#pdpick',root).onclick=async()=>{
    const fs=await pickFile('image/*',true); if(!fs) return;
    files=Array.from(fs).slice(0,20); render();
  };
  async function run(){
    toast('正在加载 PDF 组件…');
    if(!await ensureLib('https://fastly.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js',()=>!!(window.jspdf||window.jsPDF))) return toast('PDF 库加载失败，请检查网络');
    if(!$('#pdlist',root)) return;
    const J=window.jspdf?window.jspdf.jsPDF:window.jsPDF;
    if(!J) return toast('PDF 库不可用');
    toast('正在生成…');
    const doc=new J({unit:'mm', format:'a4'});
    for(let i=0;i<files.length;i++){
      const img=await loadImg(files[i]);
      const dataUrl=await new Promise(res=>{
        const c=document.createElement('canvas'); c.width=img.naturalWidth; c.height=img.naturalHeight;
        const x=c.getContext('2d'); x.fillStyle='#fff'; x.fillRect(0,0,c.width,c.height); x.drawImage(img,0,0);
        res(c.toDataURL('image/jpeg',.9));
      });
      if(i>0) doc.addPage();
      const pw=doc.internal.pageSize.getWidth(), ph=doc.internal.pageSize.getHeight();
      const iw=img.naturalWidth, ih=img.naturalHeight;
      if(mode==='fit'){
        doc.addPage([iw*0.2646, ih*0.2646], iw>ih?'landscape':'portrait');
        doc.addImage(dataUrl,'JPEG',0,0,iw*0.2646, ih*0.2646);
      }else{
        const m=10, maxW=pw-m*2, maxH=ph-m*2;
        const k=Math.min(maxW/iw, maxH/ih);
        const w=iw*k, h=ih*k;
        doc.addImage(dataUrl,'JPEG',(pw-w)/2,(ph-h)/2,w,h);
      }
    }
    download(doc.output('blob'), '图片合集_'+Date.now()+'.pdf');
    toast('PDF 已生成');
  }
  render();
}


/* ---------- 盲文转换 ---------- */
function t_braille(root){
  root.innerHTML=`
    <div class="box">
      <textarea id="bin" placeholder="输入英文、数字或标点" style="min-height:100px">Hello 2026!</textarea>
      <div class="row" style="margin-top:10px">
        <button class="btn" id="bgo2">转为盲文</button>
        <button class="btn ghost" id="bcopy2">复制</button>
      </div>
      <p class="hint">按国际通用英文盲文（一级）规则：数字前加 ⠼ 数字符，大写前加 ⠠ 大写符。中文盲文不在其中。</p>
    </div>
    <div class="box"><div id="bout" style="font-size:28px;line-height:1.8;word-break:break-all">—</div></div>
    <div class="box">
      <p class="lbl">对照表（a–z）</p>
      <div id="btab" style="font-size:18px;line-height:2;letter-spacing:2px;color:var(--sub)"></div>
    </div>`;
  const MAP={a:'1',b:'12',c:'14',d:'145',e:'15',f:'124',g:'1245',h:'125',i:'24',j:'245',k:'13',l:'123',m:'134',n:'1345',o:'135',p:'1234',q:'12345',r:'1235',s:'234',t:'2345',u:'136',v:'1236',w:'2456',x:'1346',y:'13456',z:'1356'};
  const BIT={1:0x01,2:0x02,3:0x04,4:0x08,5:0x10,6:0x20};
  const chr=dots=>String.fromCharCode(0x2800+dots.split('').reduce((a,d)=>a+BIT[d],0));
  function conv(text){
    let out=''; let numMode=false;
    for(const c of text){
      const low=c.toLowerCase();
      if(/[a-z]/.test(low)){
        if(c!==low) out+=chr('6');
        if(numMode){ numMode=false; }
        out+=chr(MAP[low]);
      }else if(/[0-9]/.test(c)){
        if(!numMode){ out+=chr('3456'); numMode=true; }
        out+=chr(MAP['abcdefghij'[+c]]);
      }else if(c===' '){ out+=' '; numMode=false; }
      else if(c==='\n'){ out+='\n'; numMode=false; }
      else if(c==='.'){ out+=chr('256'); }
      else if(c===','){ out+=chr('2'); }
      else if(c==='?'){ out+=chr('236'); }
      else if(c==='!'){ out+=chr('235'); }
      else if(c===':'){ out+=chr('25'); }
      else if(c===';'){ out+=chr('23'); }
      else if(c==='-'){ out+=chr('36'); }
      else { out+=c; }
    }
    return out;
  }
  $('#bgo2',root).onclick=()=>{ $('#bout',root).textContent=conv($('#bin',root).value)||'—'; };
  $('#bcopy2',root).onclick=()=>copyText($('#bout',root).textContent);
  $('#btab',root).textContent='abcdefghijklm'.split('').map(c=>c+' '+chr(MAP[c])).join('   ')+'\n'+'nopqrstuvwxyz'.split('').map(c=>c+' '+chr(MAP[c])).join('   ');
  $('#bgo2',root).click();
}

    const cv=$('#wccv',root), dpr=Math.min(2,window.devicePixelRatio||1);

    cv.width=w*dpr; cv.height=h*dpr;

    ctx.clearRect(0,0,w,h); ctx.fillStyle='#F7F9FC'; ctx.fillRect(0,0,w,h);
    const maxC=list.length?list[0][1]:1;

      const size=Math.round(14+ (c/maxC)*26 + (i<3?8:0));

      const tw=ctx.measureText(word).width, th=size*1.1;

/* ---------- 坡度换算 ---------- */
function t_slope(root){
  root.innerHTML=`
    <div class="box">
      <div class="row">
        <div style="flex:1"><div class="lbl">高差（m）</div><input type="number" id="slh" value="3" step="0.01"></div>
        <div style="flex:1"><div class="lbl">水平距离（m）</div><input type="number" id="sld" value="20" step="0.01"></div>
      </div>
      <div class="lbl">坡度（%）</div><input type="number" id="slp" value="15" step="0.1">
      <div class="lbl">或角度（°）</div><input type="number" id="sla" value="8.53" step="0.01">
      <p class="hint">改任意一栏，其余自动同步：高差/水平距 → 坡度与角度；坡度 ↔ 角度互换；坡向示意按 1:n 表达。</p>
    </div>
    <div class="box" id="slout"></div>`;
  let lock=false;
  function calcFromH(){
    const h=+$('#slh',root).value||0, d=+$('#sld',root).value||1;
    const p=h/d*100, a=Math.atan(h/d)*180/Math.PI;
    lock=true; $('#slp',root).value=p.toFixed(2); $('#sla',root).value=a.toFixed(2); lock=false;
    show(h,d,p,a);
  }
  function calcFromP(){
    const p=+$('#slp',root).value||0, a=Math.atan(p/100)*180/Math.PI;
    const d=+$('#sld',root).value||1, h=d*p/100;
    lock=true; $('#slh',root).value=h.toFixed(3); $('#sla',root).value=a.toFixed(2); lock=false;
    show(h,d,p,a);
  }
  function calcFromA(){
    const a=+$('#sla',root).value||0, d=+$('#sld',root).value||1;
    const h=d*Math.tan(a*Math.PI/180), p=Math.tan(a*Math.PI/180)*100;
    lock=true; $('#slh',root).value=h.toFixed(3); $('#slp',root).value=p.toFixed(2); lock=false;
    show(h,d,p,a);
  }
  function show(h,d,p,a){
    $('#slout',root).innerHTML=[
      ['坡度', p.toFixed(2)+'%'],
      ['坡角', a.toFixed(2)+'°'],
      ['比例表示', '1 : '+(h? (d/h).toFixed(2):'—')],
      ['坡长（斜边）', Math.sqrt(h*h+d*d).toFixed(2)+' m'],
      ['常见对照', p<=2?'极缓（排水地坪）':p<=5?'缓坡（场地）':p<=15?'一般边坡':p<=30?'较陡（需防护）':'陡坡（做支挡）']
    ].map(([k,v])=>`<div class="kv"><span>${k}</span><b>${v}</b></div>`).join('');
  }
  $('#slh',root).addEventListener('input',()=>{ if(!lock) calcFromH(); });
  $('#sld',root).addEventListener('input',()=>{ if(!lock) calcFromH(); });
  $('#slp',root).addEventListener('input',()=>{ if(!lock) calcFromP(); });
  $('#sla',root).addEventListener('input',()=>{ if(!lock) calcFromA(); });
  calcFromH();
}

/* ---------- 条形码（Code 39） ---------- */
function t_barcode(root){
  root.innerHTML=`
    <div class="box">
      <div class="lbl">内容（数字、大写字母及 - . $ / + % 空格）</div>
      <input type="text" id="bcin" value="ABC-2026" style="text-transform:uppercase">

      <label style="display:flex;gap:10px;align-items:center;padding-top:8px"><input type="checkbox" id="bcnum" checked style="width:20px;height:20px"> 条码下方显示文字</label>
      <p class="hint">Code 39：工业、资产标签、工牌最常见，扫码枪通用。内容自动转大写，非法字符会提示。</p>
    </div>
    <div class="box" style="padding:0;background:#fff;overflow:auto">
      <canvas id="bccv" style="width:100%;display:block"></canvas>
    </div>
    <div class="row"><button class="btn ghost" id="bcdl" style="flex:1">保存图片</button></div>`;
  const P={'0':'000110100','1':'100100001','2':'001100001','3':'101100000','4':'000110001','5':'100110000','6':'001110000','7':'000100101','8':'100100100','9':'001100100',
    'A':'100001001','B':'001001001','C':'101001000','D':'000011001','E':'100011000','F':'001011000','G':'000001101','H':'100001100','I':'001001100','J':'000011100',
    'K':'100000011','L':'001000011','M':'101000010','N':'000010011','O':'100010010','P':'001010010','Q':'000000111','R':'100000110','S':'001000110','T':'000010110',
    'U':'110000001','V':'011000001','W':'111000000','X':'010010001','Y':'110010000','Z':'011010000','-':'010000101','.':'110000100',' ':'011000100',
    '$':'010101000','/':'010100010','+':'010001010','%':'000101010','*':'010010100'};
  function draw(){
    let txt=($('#bcin',root).value||'').toUpperCase().replace(/[^0-9A-Z\-. $/+%]/g,'');
    if(!txt) txt='';
    $('#bcin',root).value=txt;
    const code='*'+txt+'*';
    const narrow=2, wide=6, gap=2;
    let w=0;
    [...code].forEach((c,i)=>{ const p=P[c]||P['-']; for(const ch of p) w+= (ch==='1'?wide:narrow)+(c===code[i+1]?'':0); w+= (i<code.length-1?gap:0); });
    const h=+$('#bch',root).value, dpr=Math.min(2,window.devicePixelRatio||1);
    const cv=$('#bccv',root);
    cv.width=(w+24)*dpr; cv.height=(h+($('#bcnum',root).checked?30:12))*dpr;
    cv.style.height=((h+($('#bcnum',root).checked?30:12)))+'px';
    const ctx=cv.getContext('2d'); ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.fillStyle='#fff'; ctx.fillRect(0,0,cv.width,dpr*cv.height);
    let x=12;
    [...code].forEach((c,i)=>{
      const p=P[c]||P['-'];
      p.split('').forEach((el,k)=>{
        const bw=el==='1'?wide:narrow;
        if(k%2===0){ ctx.fillStyle='#111'; ctx.fillRect(x,10,bw,h); }
        x+=bw;
      });
      if(i<code.length-1) x+=gap;
    });
    if($('#bcnum',root).checked){
      ctx.fillStyle='#111'; ctx.font='600 15px ui-monospace,monospace'; ctx.textAlign='center';
      ctx.fillText(txt, cv.width/(2*dpr), h+26);
    }
  }
  $('#bcin',root).addEventListener('input',draw);
  $('#bch',root).addEventListener('input',e=>{ $('#bchv',root).textContent=e.target.value+' px'; draw(); });
  $('#bcnum',root).addEventListener('change',draw);
  $('#bcdl',root).onclick=()=>{ $('#'+'bccv',root).toBlob(b=>{ download(b,'条码_'+$('#bcin',root).value+'.png'); toast('已保存'); }); };
  draw();
}

      <p class="hint">前景色比背景色浅时可能扫不出来，建议深色前景；中心标签会遮住一部分码点，容错率已达 H 级。</p>
    </div>
    <div class="box" style="text-align:center;padding:0"><canvas id="qscv" style="max-width:100%;display:block;margin:0 auto"></canvas></div>
    <div class="row"><button class="btn ghost" id="qsdl" style="flex:1">保存 PNG</button></div>`;
  async function run(){
    toast('正在加载二维码组件…');
    if(!await ensureLib('https://fastly.jsdelivr.net/npm/qrcode@1.4.4/build/qrcode.min.js',()=>!!window.QRCode)) return toast('二维码库加载失败，请联网后重试');
    if(!window.QRCode) return;
    const cv=$('#qscv',root); if(!cv) return;
    window.QRCode.toCanvas(cv, $('#qsin',root).value||' ', {margin:2, width:Math.min(560, Math.min(560, Math.floor(window.innerWidth*.86))),
      color:{dark:$('#qsfg',root).value, light:$('#qfbg',root).value}, errorCorrectionLevel:'H'}, err=>{
      if(err) return toast('生成失败：'+err.message);
      const tag=($('#qstag',root).value||'').trim();
      if(tag){
        const c=cv.getContext('2d'), w=cv.width;
        const fs=Math.round(w*0.15);
        c.font=`700 ${fs}px -apple-system,"PingFang SC",sans-serif`;
        const tw=c.measureText(tag).width;
        const bw=Math.max(fs*1.5, tw+fs*0.9), bh=fs*1.5;
        c.fillStyle=$('#qfbg',root).value;
        const r=Math.min(bw,bh)/4;
        const box=bw;
        const x=w/2-bw/2, y=w/2-bh/2;
        c.beginPath();
        c.moveTo(x+r,y); c.lineTo(x+bw-r,y); c.quadraticCurveTo(x+bw,y,x+bw,y+r);
        c.lineTo(x+bw,y+bh-r); c.quadraticCurveTo(x+bw,y+bh,x+bw-r,y+bh);
        c.lineTo(x+r,y+bh); c.quadraticCurveTo(x,y+bh,x,y+bh-r);
        c.lineTo(x,y+r); c.quadraticCurveTo(x,y,x+r,y); c.closePath(); c.fill();
        c.fillStyle=$('#qsfg',root).value;
        c.font=`700 ${fs}px -apple-system,"PingFang SC",sans-serif`;
        c.textAlign='center'; c.textBaseline='middle';
        c.fillText(tag, w/2, w/2+1);
      }
      toast('已生成');
    });
  }
  $('#qsgo',root).onclick=run;
  $('#qsdl',root).onclick=()=>{ $('#qscv',root).toBlob(b=>{ download(b,'二维码.png'); toast('已保存'); }); };
  run();
}

/* ---------- 快递单号识别 ---------- */
function t_express(root){
  root.innerHTML=`
    <div class="box">
      <input type="text" id="exin" placeholder="输入或粘贴快递单号" style="text-transform:uppercase" value="YT1234567890123">
      <button class="btn block" id="exgo" style="margin-top:10px">识别承运商</button>
      <p class="hint">按单号前缀和位数规则做离线匹配，只给候选，不保证唯一；同一单号可能被多家复用。</p>
    </div>
    <div class="box" id="exout"></div>`;
  const RULES=[
    ['顺丰速运','SF 开头，或 12/15 位数字且以 1 开头（同城/标快常见）', s=>/^SF/.test(s) || ((s.length===12||s.length===15)&&s.startsWith('1'))],
    ['京东物流','JD 开头，或 JDV/JDX 前缀', s=>/^JD/.test(s)],
    ['圆通速递','YT 开头，或 12 位数字以 D 开头', s=>/^YT/.test(s)||(s.length===12&&/^D/.test(s))],
    ['中通快递','12 位数字，75/76/77/78 开头', s=>/^(75|76|77|78)/.test(s)&&(s.length===12||s.length===14)],
    ['申通快递','12 位数字，77/88/66/36 开头（与中通部分重叠）', s=>/^(77|88|66|36)/.test(s)&&s.length===12],
    ['韵达速递','13 位数字，43/46/31 开头', s=>/^(43|46|31)/.test(s)&&s.length===13],
    ['极兔速递','JT 开头，或 12 位数字以 J 开头', s=>/^JT/.test(s)||(s.length===12&&/^J/.test(s))],
    ['德邦快递','DP 开头，或 8 位、10 位纯数字', s=>/^DP/.test(s)||(/^\d{8}$/.test(s)||/^\d{10}$/.test(s))],
    ['中国邮政 EMS','字母开头（E/EA/EB/EM）13 位，或 9 开头 13 位数字', s=>/^E[A-Z]*\d{8,}$/.test(s)||(/^9/.test(s)&&s.length===13)],
    ['百世快递','BQ 开头，或 12 位数字以 B 开头', s=>/^BQ/.test(s)||(s.length===12&&/^B/.test(s))]
  ];
  function run(){
    const raw=($('#exin',root).value||'').replace(/[\s-]/g,'').toUpperCase();
    $('#exin',root).value=raw;
    if(!raw) return $('#exout',root).innerHTML='<p class="hint" style="margin:0">请输入单号</p>';
    const hits=RULES.filter(r=>r[2](raw));
    const info=[
      ['单号',raw],
      ['长度',raw.length+' 位'],
      ['字符类型',/^\d+$/.test(raw)?'纯数字':/^[A-Z]+\d+$/.test(raw)?'字母+数字':'混合']
    ].map(([k,v])=>`<div class="kv"><span>${k}</span><b>${v}</b></div>`).join('');
    $('#exout',root).innerHTML= info + `<p class="lbl" style="margin-top:10px">候选承运商（${hits.length}）</p>`
      + (hits.length? hits.map(h=>`<div style="padding:9px 0;border-bottom:1px dashed var(--line)"><b>${h[0]}</b><p class="hint" style="margin:2px 0 0">${h[1]}</p></div>`).join('')
        : '<p class="hint">没匹配到已知规则，可能是小众快递或录错，建议直接去官网查询。</p>');
  }
  $('#exgo',root).onclick=run;
  $('#exin',root).addEventListener('input',run);
  run();
}

/* ---------- 加速度曲线 ---------- */
function t_motion(root){
  root.innerHTML=`
    <div class="box">
      <canvas id="mcv" style="width:100%;height:180px;border-radius:10px;background:#FAFBFD;border:1px solid var(--line)"></canvas>
      <div style="display:flex;justify-content:space-between;margin-top:10px;font-size:12.5px;color:var(--sub)">
        <span style="color:#2C63F0">前后 <b id="mb" style="color:var(--ink)">--</b></span>
        <span style="color:#E2543B">左右 <b id="mg" style="color:var(--ink)">--</b></span>
      </div>
    </div>
    <p class="hint">两条曲线是手机前后、左右方向的倾角变化。晃动手机看曲线，用来判断传感器是否正常。</p>`;
  const cv=$('#mcv',root);
  const ctx=cv.getContext('2d');
  const dataB=[], dataG=[], N=180;
  let raf=null;
  function size(){
    const dpr=Math.min(2, window.devicePixelRatio||1);
    cv.width=cv.clientWidth*dpr; cv.height=cv.clientHeight*dpr;
    ctx.setTransform(dpr,0,0,dpr,0,0);
  }
  function draw(){
    ctx.clearRect(0,0,cv.clientWidth,cv.clientHeight);
    const h=cv.clientHeight, w=cv.clientWidth;
    ctx.strokeStyle='#E5E8EC'; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(0,h/2); ctx.lineTo(w,h/2); ctx.stroke();
    [[dataB,'#2C63F0'],[dataG,'#E2543B']].forEach(([arr,c])=>{
      if(arr.length<2) return;
      ctx.strokeStyle=c; ctx.lineWidth=1.6; ctx.beginPath();
      arr.forEach((v,i)=>{
        const x=i/(N-1)*w, y=h/2 - Math.max(-h/2+6, Math.min(h/2-6, v*2));
        i?ctx.lineTo(x,y):ctx.moveTo(x,y);
      });
      ctx.stroke();
    });
    raf=requestAnimationFrame(draw);
  }
  size(); draw();
  root.__mcStop=readOrientation(e=>{
    dataB.push(e.beta||0); dataG.push(e.gamma||0);
    if(dataB.length>N) dataB.shift();
    if(dataG.length>N) dataG.shift();
    const mb=$('#mb',root), mg=$('#mg',root);
    if(mb) mb.textContent=deg1(e.beta||0)+'°';
    if(mg) mg.textContent=deg1(e.gamma||0)+'°';
  },()=>{ const mb=$('#mb',root); if(mb) mb.textContent='无传感器'; });
  return ()=>{ cancelAnimationFrame(raf); if(root.__mcStop) root.__mcStop(); };
}

/* ---------- Markdown 转 HTML ---------- */
function t_mdhtml(root){
  root.innerHTML=`
    <div class="box">
      <textarea id="mdin" style="min-height:150px" placeholder="# 标题&#10;&#10;正文 **加粗** 和 \`代码\`"># 小羽工具箱

支持 **加粗**、*斜体*、\`代码\`、[链接](https://example.com)。

- 列表项一
- 列表项二
</textarea>
      <button class="btn block" id="mdgo" style="margin-top:10px">转换</button>
    </div>
    ${txtOut('HTML 代码','mdout')}
    <div class="box"><p class="lbl">预览</p><div id="mdpre" style="font-size:14.5px;line-height:1.7"></div></div>`;
  function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  function conv(md){
    const out=[];
    md.split(/\n{2,}/).forEach(block=>{
      let t=block.trim(); if(!t) return;
      if(/^#{1,3} /.test(t)){
        const lv=t.match(/^#+/)[0].length;
        out.push('<h'+lv+'>'+esc(t.replace(/^#+\s*/,''))+'</h'+lv+'>');
        return;
      }
      const items=t.split('\n').filter(l=>/^[-*]\s+/.test(l));
      if(items.length){
        out.push('<ul>'+items.map(l=>'<li>'+inline(esc(l.replace(/^[-*]\s+/,''))) +'</li>').join('')+'</ul>');
        return;
      }
      out.push('<p>'+inline(esc(t).replace(/\n/g,'<br>'))+'</p>');
    });
    function inline(s){

  let timer=null, phase=0, count=4, round=0, scale=0;
  const circle=$('#brCircle',root);
  function tick(){
    count--;
    if(count>0){ $('#brCnt',root).textContent=count; return; }
    phase=(phase+1)%3; round += phase===0?1:0;
    if(phase===0){ $('#brPhase',root).textContent='吸气'; count=4; circle.style.transform='scale(1.12)'; }
    else if(phase===1){ $('#brPhase',root).textContent='屏息'; count=7; }
    else { $('#brPhase',root).textContent='呼气'; count=8; circle.style.transform='scale(0.86)'; }
    $('#brCnt',root).textContent=count;
    if(round>=4 && phase===0){ stop(); toast('完成 4 轮，放松一下'); }
  }
  function stop(){ clearInterval(timer); timer=null; phase=0; round=0; circle.style.transform='scale(1)';
    $('#brPhase',root).textContent='准备'; $('#brCnt',root).textContent='0'; }
  $('#brGo',root).onclick=()=>{
    stop(); $('#brPhase',root).textContent='吸气'; count=4; $('#brCnt',root).textContent=4;

    timer=setInterval(tick,1000);
  };
  $('#brStop',root).onclick=stop;

}

    const arr=Array.isArray(d)?d:[d];
    const cols=Array.from(new Set(arr.flatMap(o=>Object.keys(o||{}))));
    const cell=v=>{
      if(v==null) return '';
      if(typeof v==='object') v=JSON.stringify(v);
      v=String(v);
      return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;
    };
    const csv=[cols.join(','), ...arr.map(o=>cols.map(c=>cell(o[c])).join(','))].join('\n');
    $('#jcOut',root).textContent=csv;
    toast('已转换 '+arr.length+' 行');
  };
}

/* ---------- CSV 转 JSON ---------- */
function t_csv2json(root){
  root.innerHTML=`
    <div class="box">
      <textarea id="cjIn" style="min-height:140px" placeholder="name,age&#10;张三,20&#10;李四,22"></textarea>
      <div class="row" style="margin-top:10px">
        <button class="btn" id="cjGo">转 JSON</button>
        <button class="btn ghost" id="cjDl">下载 .json</button>
      </div>
    </div>
    ${txtOut('JSON 结果','cjOut')}`;
  function parse(){
    const t=$('#cjIn',root).value.trim();
    if(!t) return null;
    const rows=[]; let row=[], cur='', q=false;
    for(let i=0;i<t.length;i++){
      const c=t[i];
      if(q){
        if(c==='"'){ if(t[i+1]==='"'){ cur+='"'; i++; } else q=false; }
        else cur+=c;
      } else if(c==='"') q=true;
      else if(c===','){ row.push(cur); cur=''; }
      else if(c==='\n'){ row.push(cur); rows.push(row); row=[]; cur=''; }
      else if(c==='\r'){}
      else cur+=c;
    }
    row.push(cur); if(row.length>1) rows.push(row);
    if(!rows.length) return null;
    const head=rows[0].map(h=>h.trim());
    return rows.slice(1).map(r=>{ const o={}; head.forEach((h,i)=>o[h]=(r[i]||'').trim()); return o; });
  }
  $('#cjGo',root).onclick=()=>{
    const d=parse();
    if(!d) return toast('没有可转换的内容');
    $('#cjOut',root).textContent=JSON.stringify(d,null,2);
    toast('已转换 '+d.length+' 行');
  };
  $('#cjDl',root).onclick=()=>{
    const d=parse(); if(!d) return toast('没有可转换的内容');
    download(new Blob([JSON.stringify(d,null,2)],{type:'application/json'}),'data_'+Date.now()+'.json');
    toast('已下载');
  };
}

function t_urlparams(root){
  root.innerHTML=`
    <div class="box">
      <p class="lbl">解析：粘贴完整链接</p>
      <div class="row"><input id="upIn" placeholder="https://example.com/path?a=1&b=2"><button class="btn" id="upGo" style="flex:0 0 84px">解析</button></div>
      <div id="upOut" style="margin-top:12px"></div>
    </div>
    <div class="box">
      <p class="lbl">构建：每行 key=value</p>
      <textarea id="upBuild" style="min-height:100px">q=工具箱
page=1</textarea>
      <button class="btn block" id="upMake" style="margin-top:10px">生成查询串</button>
      <div class="out" id="upRes" style="min-height:40px">—</div>
    </div>`;
  $('#upGo',root).onclick=()=>{
    let u; try{ u=new URL($('#upIn',root).value.trim()); }catch(e){ return toast('链接格式不对'); }
    const rows=[['协议',u.protocol.replace(':','')],['主机',u.host],['路径',u.pathname],['Hash',u.hash||'—']];
    const params=Array.from(u.searchParams.entries());
    $('#upOut',root).innerHTML=rows.map(([k,v])=>`<div class="kv"><span>${k}</span><b style="font-weight:500">${escHtml(v)}</b></div>`).join('')
      + (params.length?`<p class="lbl" style="margin-top:10px">查询参数</p>`+params.map(([k,v])=>`<div class="kv"><span>${escHtml(k)}</span><b style="font-weight:500">${escHtml(v)}</b></div>`).join(''):'');
  };
  $('#upMake',root).onclick=()=>{
    const lines=$('#upBuild',root).value.split('\n').map(s=>s.trim()).filter(Boolean);
    const sp=new URLSearchParams();
    lines.forEach(l=>{ const i=l.indexOf('='); if(i<0){ sp.append(l,''); } else sp.append(l.slice(0,i).trim(), l.slice(i+1).trim()); });
    $('#upRes',root).textContent=sp.toString()||'—';
  };
  function escHtml(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
}

/* 静态查询表 */
function listTool(root, opt){
  root.innerHTML=`<div class="box">
    <input id="lstQ" placeholder="${opt.ph||'搜索关键词'}">
    <div id="lstW" style="margin-top:10px"></div>
  </div>${opt.note?`<p class="hint">${opt.note}</p>`:''}`;
  const W=$('#lstW',root), rows=opt.rows;
  function render(q){
    q=(q||'').trim().toLowerCase();
    const hit=rows.filter(r=>!q || r.join(' ').toLowerCase().includes(q));
    W.innerHTML = hit.length? hit.map(r=>`<div style="display:flex;justify-content:space-between;gap:10px;padding:7px 2px;border-bottom:1px solid #F1F3F7">
      <span style="font-size:13px;color:#2C63F0">${r[0]}</span><span style="font-size:13.5px;color:var(--sub);text-align:right">${r[1]}</span></div>`).join('')
      : '<p class="hint">没有匹配项</p>';
  }
  $('#lstQ',root).oninput=e=>render(e.target.value);
  render('');
}

/* 表单计算器：fields = [id, label, 默认值, 选项数组?, step?] */
function calcTool(root, opt){
  root.innerHTML=`<div class="box">
    <div style="display:grid;grid-template-columns:repeat(2,1fr);gap:10px">
    ${opt.fields.map(f=>{
      const id=f[0], label=f[1], def=f[2];
      if(Array.isArray(f[3])) return `<div><div class="lbl">${label}</div><select id="cf_${id}">${f[3].map(o=>`<option value="${o[0]}"${o[0]==String(def)?' selected':''}>${o[1]}</option>`).join('')}</select></div>`;
      return `<div><div class="lbl">${label}</div><input type="number" id="cf_${id}" value="${def}" step="${typeof f[3]==='number'?f[3]:(f[4]||1)}"></div>`;
    }).join('')}</div>
    <div id="cfOut" style="margin-top:14px"></div>
  </div>${opt.note?`<p class="hint">${opt.note}</p>`:''}`;
  function run(){
    const v={};
    opt.fields.forEach(f=>{ const el=$('#cf_'+f[0],root); if(!el) return; v[f[0]] = Array.isArray(f[3]) ? el.value : (+el.value||0); });
    let rows=[];
    try{ rows=opt.run(v)||[]; }catch(e){ rows=[['计算失败','检查输入']]; }
    $('#cfOut',root).innerHTML=rows.map(r=>`<div class="kv"><span>${r[0]}</span><b>${r[1]}</b></div>`).join('');
  }
  root.addEventListener('input',run);
  root.addEventListener('change',run);
  run();
}

/* 文本转换器：modes = [{label, fn}] */
function convTool(root, opt){

/* ---------- 麦克风电平 ---------- */
function t_miclevel(root){
  root.innerHTML=`
    <div class="box" style="text-align:center">
      <div style="height:18px;border-radius:9px;background:#F1F3F7;overflow:hidden;margin-bottom:10px">
        <div id="mlBar" style="height:100%;width:0;background:linear-gradient(90deg,#17A673,#D9822B,#E2543B);transition:width .08s linear"></div>
      </div>
      <div id="mlDb" style="font-size:22px;font-weight:700;font-variant-numeric:tabular-nums">-- dB</div>
      <div class="row" style="margin-top:14px;justify-content:center">
        <button class="btn" id="mlGo">开始采集</button>
        <button class="btn ghost" id="mlStop">停止</button>
      </div>
    </div>
    <p class="hint">用来判断麦克风是否正常、环境有多吵。需要授权麦克风权限。</p>`;
  let stream=null, ac=null, raf=null;
  async function start(){
    try{
      stream=await navigator.mediaDevices.getUserMedia({audio:true});
      ac=new (window.AudioContext||window.webkitAudioContext)();
      const src=ac.createMediaStreamSource(stream);
      const an=ac.createAnalyser(); an.fftSize=512; src.connect(an);
      const buf=new Uint8Array(an.frequencyBinCount);
      const loop=()=>{
        an.getByteFrequencyData(buf);
        let sum=0; for(let i=0;i<buf.length;i++) sum+=buf[i];
        const avg=sum/buf.length, pct=Math.min(1, avg/140);
        const db=Math.round(20*Math.log10(Math.max(avg,1)/255)+94);
        $('#mlBar',root).style.width=(pct*100).toFixed(0)+'%';
        $('#mlDb',root).textContent=db+' dB';
        raf=requestAnimationFrame(loop);
      };
      loop();
      toast('采集中');
    }catch(e){ toast('无法访问麦克风'); }
  }
  function stop(){
    cancelAnimationFrame(raf); raf=null;
    if(stream){ stream.getTracks().forEach(t=>t.stop()); stream=null; }
    if(ac){ try{ac.close();}catch(e){} ac=null; }
    $('#mlDb',root).textContent='-- dB'; $('#mlBar',root).style.width='0';
  }
  $('#mlGo',root).onclick=start;
  $('#mlStop',root).onclick=stop;
  return stop;
}

/* ---------- 电池状态 ---------- */
function t_battery(root){
  root.innerHTML=`
    <div class="box" style="text-align:center;padding:22px 16px">
      <div id="btPct" style="font-size:40px;font-weight:700;font-variant-numeric:tabular-nums">--%</div>
      <div id="btSt" class="hint">读取中…</div>
      <div style="height:14px;border-radius:7px;background:#F1F3F7;margin-top:14px;overflow:hidden">
        <div id="btBar" style="height:100%;width:0;background:#17A673"></div>
      </div>
    </div>
    <div class="box"><div class="kv"><span>充电状态</span><b id="btChg">—</b></div>
      <div class="kv"><span>预计可用</span><b id="btTime">—</b></div>
      <div class="kv"><span>预计充满</span><b id="btFull">—</b></div></div>
    <p class="hint">部分浏览器（含多数手机 WebView）不开放电池接口，读不到时会显示 —。</p>`;
  function fmt(sec){ if(!sec||!isFinite(sec)) return '—'; return Math.floor(sec/3600)+' 小时 '+Math.round(sec%3600/60)+' 分'; }
  if(!navigator.getBattery){ $('#btSt',root).textContent='当前环境不支持电池接口'; return; }
  navigator.getBattery().then(b=>{
    const upd=()=>{
      const p=Math.round(b.level*100);
      $('#btPct',root).textContent=p+'%';
      $('#btBar',root).style.width=p+'%';
      $('#btBar',root).style.background=p>50?'#17A673':p>20?'#D9822B':'#E2543B';
      $('#btChg',root).textContent=b.charging?'充电中':'未充电';
      $('#btTime',root).textContent=fmt(b.dischargingTime);
      $('#btFull',root).textContent=fmt(b.chargingTime);
      $('#btSt',root).textContent=b.charging?'正在充电':'放电中';
    };
    upd();
    ['levelchange','chargingchange','chargingtimechange','dischargingtimechange'].forEach(k=>b.addEventListener(k,upd));
  }).catch(()=>{ $('#btSt',root).textContent='读取失败'; });
}

/* ---------- 多点触控 ---------- */
function t_multitouch(root){
  root.innerHTML=`
    <div class="box">
      <div id="mtBox" style="height:300px;border-radius:10px;background:#FAFBFD;border:1px solid var(--line);position:relative;overflow:hidden;touch-action:none"></div>
      <div class="kv" style="margin-top:10px"><span>当前触点数</span><b id="mtNow">0</b></div>
      <div class="kv"><span>最多同时</span><b id="mtMax">0</b></div>
    </div>
    <p class="hint">把多根手指同时按在灰色区域，测试屏幕支持几点触控。</p>`;
  const box=$('#mtBox',root);
  let max=0;
  function paint(pts){
    box.innerHTML=pts.map(p=>`<div style="position:absolute;left:${p.x}px;top:${p.y}px;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;background:#2C63F0;opacity:.45;border:2px solid #2C63F0;pointer-events:none"></div>`).join('');
  }
  box.addEventListener('touchstart',e=>{ e.preventDefault(); const pts=Array.from(e.touches).map(t=>({x:t.clientX-box.getBoundingClientRect().left,y:t.clientY-box.getBoundingClientRect().top}));
    $('#mtNow',root).textContent=e.touches.length; if(e.touches.length>max){ max=e.touches.length; $('#mtMax',root).textContent=max; } paint(pts); },{passive:false});
  box.addEventListener('touchmove',e=>{ e.preventDefault(); const pts=Array.from(e.touches).map(t=>({x:t.clientX-box.getBoundingClientRect().left,y:t.clientY-box.getBoundingClientRect().top})); paint(pts); },{passive:false});
  box.addEventListener('touchend',e=>{ paint(Array.from(e.touches).map(t=>({x:t.clientX-box.getBoundingClientRect().left,y:t.clientY-box.getBoundingClientRect().top})));
    $('#mtNow',root).textContent=e.touches.length; },{passive:false});
}

/* ---------- 环境光 ---------- */
function t_light(root){
  root.innerHTML=`

  if(!('AmbientLightSensor' in window)){ $('#liH',root).textContent='当前环境不支持光线传感器接口'; return; }
  try{

    s.addEventListener('reading',()=>{ $('#liV',root).textContent=Math.round(s.illuminance)+' lux'; $('#liH',root).textContent=s.illuminance>200?'环境明亮':'环境偏暗'; });

  }catch(e){ $('#liH',root).textContent='传感器启动失败'; }
}

/* ---------- 按键检测 ---------- */
function t_keytest(root){
  root.innerHTML=`
    <div class="box" style="text-align:center;padding:20px">
      <div id="ktK" style="font-size:26px;font-weight:700;word-break:break-all">按下任意键</div>

  const log=[];
  function onKey(e){
    $('#ktK',root).textContent=e.key===' '?'空格':e.key;
    $('#ktC',root).textContent=`key: ${e.key} · code: ${e.code} · keyCode: ${e.keyCode}`;

}

/* ---------- 声道测试 ---------- */
function t_channel(root){
  root.innerHTML=`
    <div class="box" style="text-align:center;padding:18px">
      <button class="btn block" id="chL">只响左声道</button>
      <button class="btn ghost block" id="chR" style="margin-top:10px">只响右声道</button>
      <button class="btn ghost block" id="chB" style="margin-top:10px">同时响（单声道）</button>
      <button class="btn ghost block" id="chStop" style="margin-top:10px">停止</button>
    </div>
    <p class="hint">戴耳机测：如果只有一边响，说明耳机或设备声道有问题。</p>`;
  let ac=null, osc=null;
  function stop(){ if(osc){try{osc.stop()}catch(e){} osc=null;} if(ac){try{ac.close()}catch(e){} ac=null;} }
  function play(pan){
    stop();
    try{
      ac=new (window.AudioContext||window.webkitAudioContext)();
      osc=ac.createOscillator(); const g=ac.createGain();
      osc.frequency.value=440; g.gain.value=0.25;
      if(pan===0 || pan===1){
        const p=ac.createStereoPanner(); p.pan.value=pan?1:-1;
        osc.connect(g); g.connect(p); p.connect(ac.destination);
      }else{ osc.connect(g); g.connect(ac.destination); }
      osc.start();
      toast(pan===0?'左声道':pan===1?'右声道':'双声道');
    }catch(e){ toast('音频不可用'); }
  }
  $('#chL',root).onclick=()=>play(0);
  $('#chR',root).onclick=()=>play(1);
  $('#chB',root).onclick=()=>play(-1);
  $('#chStop',root).onclick=stop;
  return stop;
}
